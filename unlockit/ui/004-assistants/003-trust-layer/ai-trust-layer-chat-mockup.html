<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockit - AI Data Assistant</title>
    <link rel="stylesheet" href="../../common-mock-assets/css/unlockit-ui.css">
    <link rel="stylesheet" href="../../common-mock-assets/css/navigation.css">
    <link rel="stylesheet" href="../../common-mock-assets/css/profile-dropdown.css">
    <link rel="stylesheet" href="../../common-mock-assets/css/notifications-dropdown.css">
    <link rel="stylesheet" href="../../common-mock-assets/css/help-dropdown.css">
    <link rel="stylesheet" href="../../common-mock-assets/components/modals/language-modal.css">
    <link rel="stylesheet" href="../../common-mock-assets/css/beta-badge.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.9.0/pivot.min.css">
    <style>
        /* Page-specific overrides */
        .default-layout__content {
            background: radial-gradient(circle at top, #f7f3ff 0%, #f8f9fa 55%, #f5f4fb 100%);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .page-content {
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .page-content.chat-mode {
            padding: 1rem 1.429rem;
        }

        .chat-container {
            flex: 1;
            background: transparent;
            border: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .chat-container:not(.initial) {
            background: #ffffff;
            border: 1px solid #e7e7e7;
            border-radius: 0.857rem;
        }

        .chat-body {
            flex: 1;
            display: none;
            min-height: 0;
            flex-direction: column;
        }

        .chat-container.split .chat-body {
            display: flex;
        }

        .chat-body-main {
            flex: 1;
            display: flex;
            gap: 1rem;
            min-height: 0;
        }

        .chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .map-pane {
            width: 38%;
            min-width: 320px;
            display: none;
            flex-direction: column;
            position: relative;
            transition: width 0.2s ease;
        }

        .chat-container.split .map-pane {
            display: flex;
        }

        .map-pane.collapsed {
            width: auto;
            min-width: auto;
        }

        .map-pane.collapsed .map-card {
            display: none;
        }

        .map-collapse-handle {
            display: none;
            position: absolute;
            top: 0;
            bottom: 0;
            left: -18px;
            width: 36px;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .map-pane.collapsed .map-collapse-handle {
            display: flex;
        }

        .map-collapse-handle button {
            border: none;
            background: #ffffff;
            color: #1f2937;
            font-weight: 600;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .map-toolbar-link.is-hidden {
            display: none;
        }

        .map-collapse-toggle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20px;
            width: 20px;
            border-radius: 0;
            border: none;
            border-left: 1px solid #e5e7eb;
            background: #ffffff;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            cursor: pointer;
        }

        .map-collapse-toggle.is-hidden {
            display: none;
        }

        .map-collapse-toggle svg {
            width: 16px;
            height: 16px;
            stroke: #111827;
            stroke-width: 2.2;
        }

        .map-pane.collapsed .map-collapse-toggle svg {
            transform: rotate(180deg);
        }

        .chat-header.is-hidden {
            display: none;
        }

        .chat-header {
            padding: 1rem 1.429rem;
            border-bottom: 1px solid #e7e7e7;
            background: #ffffff;
        }

        .chat-title {
            font-size: 1.286rem;
            color: #3a3b45;
            margin: 0;
            font-weight: 400;
        }

        .welcome-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 0;
            text-align: left;
            gap: 1rem;
            height: 100%;
        }

        .location-intro {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 720px;
        }

        .location-title {
            font-size: 1.5rem;
            color: #3a3b45;
            margin: 0;
            font-weight: 600;
        }

        .location-description {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.5;
            margin: 0;
        }

        .map-card {
            width: 100%;
            max-width: none;
            border: 1px solid #e7e7e7;
            border-top: 0;
            border-radius: 0;
            background: #ffffff;
            overflow: hidden;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        .map-toolbar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e7e7e7;
            background: #ffffff;
        }

        .map-toolbar-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #3a3b45;
            white-space: nowrap;
        }

        .map-search {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8f9fa;
            border: 1px solid #e7e7e7;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
        }

        .map-search svg {
            width: 16px;
            height: 16px;
            color: #6c757d;
        }

        .map-search .mic-icon {
            width: 18px;
            height: 18px;
            color: #6c757d;
            margin-left: 0.25rem;
        }

        .map-search-input {
            border: none;
            background: transparent;
            font-size: 13px;
            color: #3a3b45;
            width: 100%;
            outline: none;
        }

        .map-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .map-toolbar-link {
            font-size: 13px;
            color: #664EE0;
            font-weight: 600;
            text-decoration: none;
        }


        .map-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            justify-content: flex-end;
        }

        .map-action-button {
            border: 1px solid #e7e7e7;
            background: #f8f9fa;
            color: #3a3b45;
            font-size: 12px;
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .map-action-button.is-active {
            background: #664EE0;
            border-color: #664EE0;
            color: #ffffff;
        }

        .map-action-button:disabled {
            background: #e5e7eb;
            border-color: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        .option-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .selection-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 100%;
        }

        .step-title {
            font-size: 13px;
            font-weight: 600;
            color: #3a3b45;
            margin-bottom: 0.35rem;
        }

        .step-summary {
            border: 1px solid #e7e7e7;
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            background: #ffffff;
        }

        .step-summary.is-stale {
            border-color: #f59e0b;
            background: #fff7ed;
        }

        .step-summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #3a3b45;
            margin-bottom: 0.35rem;
        }

        .stale-badge {
            font-size: 11px;
            font-weight: 600;
            color: #92400e;
            background: #ffedd5;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 0.75rem;
        }

        .selection-group label {
            font-size: 12px;
            font-weight: 600;
            color: #3a3b45;
            margin-bottom: 0.35rem;
            display: block;
        }

        .field-reset-btn {
            border: none;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            padding: 0;
            margin-left: 0.35rem;
            vertical-align: middle;
        }

        .field-reset-btn:hover {
            color: #6b7280;
        }

        .field-reset-btn svg {
            width: 14px;
            height: 14px;
        }

        .selection-group select {
            width: 100%;
            border: 1px solid #e7e7e7;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 13px;
        }

        .selection-group input[type="range"] {
            width: 100%;
        }

        .selection-range {
            position: relative;
            height: 28px;
            display: flex;
            align-items: center;
        }

        .selection-range.is-tall {
            height: 40px;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6c757d;
        }

        .range-dual {
            position: relative;
            width: 100%;
        }

        .range-dual input[type="range"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            background: transparent;
            pointer-events: none;
        }

        .range-dual input[type="range"].is-max {
            z-index: 2;
        }

        .range-dual input[type="range"].is-min {
            z-index: 2;
        }

        .range-dual input[type="range"].is-active {
            z-index: 4;
        }

        .range-dual input[type="range"]::-webkit-slider-thumb {
            pointer-events: all;
        }

        .range-dual input[type="range"]::-moz-range-thumb {
            pointer-events: all;
        }

        .range-dual input[type="range"]::-ms-thumb {
            pointer-events: all;
        }

        .hint-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid #d3d6df;
            color: #6c757d;
            font-size: 11px;
            font-weight: 700;
            margin-left: 0.35rem;
            position: relative;
        }

        .hint-chip:hover .hint-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(-4px);
        }

        .hint-tooltip {
            position: absolute;
            bottom: 130%;
            right: 0;
            background: #1f2937;
            color: #ffffff;
            font-size: 11px;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            width: 260px;
            line-height: 1.4;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 5;
            pointer-events: none;
        }

        .dql-scale {
            position: absolute;
            left: 0;
            right: 0;
            top: -6px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #6c757d;
            pointer-events: none;
            padding: 0 8px;
        }

        .dql-scale span {
            position: relative;
            text-align: center;
            padding-top: 0.6rem;
        }

        .dql-scale span::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 6px;
            background: #cbd5e1;
            transform: translateX(-50%);
        }

        .dql-label {
            position: relative;
            cursor: help;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 0 2px;
            border-radius: 6px;
        }

        .dql-label:hover .hint-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(-4px);
        }

        .dql-label.is-selected {
            color: #111827;
            background: #ffffff;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.12);
            padding: 0.15rem 0.35rem;
        }

        .dql-label[data-level="0"] { color: #b91c1c; }
        .dql-label[data-level="1"] { color: #c2410c; }
        .dql-label[data-level="2"] { color: #a16207; }
        .dql-label[data-level="3"] { color: #15803d; }
        .dql-label[data-level="4"] { color: #047857; }

        .selection-group.dql-group {
            margin-top: 0.25rem;
            position: relative;
        }

        .selection-group.dql-group .selection-range {
            margin-top: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .dql-selection-summary {
            margin-top: 0.5rem;
            font-size: 12px;
            color: #4b5563;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 600;
        }

        .dql-selection-summary span {
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            background: #f1f5f9;
            color: #1f2937;
        }

        .dql-picker-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .dql-picker {
            position: relative;
        }

        .dql-picker-title {
            font-size: 12px;
            font-weight: 600;
            color: #3a3b45;
            margin-bottom: 0.35rem;
        }

        .dql-current {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.75rem;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0.65rem 0.75rem;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.06);
            transition: all 0.2s ease;
        }

        .dql-current:hover {
            border-color: #94a3b8;
        }

        .dql-current:hover .dql-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(-4px);
        }

        .dql-square {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 12px;
        }

        .dql-current-title {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
        }

        .dql-current-desc {
            font-size: 11px;
            color: #6b7280;
            margin-top: 0.15rem;
        }

        .dql-tooltip {
            bottom: 115%;
            right: 0;
            width: 240px;
        }

        .dql-options {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 0.5rem);
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0.65rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 16px 30px rgba(15, 23, 42, 0.14);
            z-index: 4;
        }

        .dql-options.is-open {
            display: flex;
        }

        .dql-option {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.65rem;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.5rem 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dql-option:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .dql-option.is-active {
            border-color: #22c55e;
            background: #ecfdf5;
        }

        .dql-summary-cards {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .dql-summary-card {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.35rem 0.5rem;
            background: #ffffff;
            font-size: 12px;
            font-weight: 600;
            color: #111827;
        }

        .dql-summary-card .dql-square {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 12px;
        }

        .selection-checks {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .selection-checks label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.6rem;
            border: 1px solid #e7e7e7;
            border-radius: 999px;
            font-size: 12px;
            color: #3a3b45;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .selection-checks label:has(input:checked) {
            border-color: #22c55e;
            background: #ecfdf5;
            color: #0f5132;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.16);
        }

        .selection-checks input:checked {
            accent-color: #22c55e;
        }

        .data-metrics-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .data-metrics-header {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .data-metrics-subtitle {
            font-size: 12px;
            color: #6b7280;
        }

        .data-category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .data-category-tab {
            border: 1px solid #e5e7eb;
            background: #ffffff;
            border-radius: 999px;
            padding: 0.3rem 0.7rem;
            font-size: 12px;
            font-weight: 600;
            color: #3a3b45;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .data-category-tab.is-active {
            border-color: #4338ca;
            background: #eef2ff;
            color: #1e1b4b;
            box-shadow: 0 8px 16px rgba(67, 56, 202, 0.16);
        }

        .data-metrics-panel {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 0.75rem;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        .data-metrics-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.65rem;
        }

        .data-metrics-panel-title {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
        }

        .data-metrics-actions {
            display: flex;
            gap: 0.35rem;
        }

        .data-metrics-action {
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            background: #f9fafb;
            color: #374151;
            font-size: 11px;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .data-metrics-action:hover {
            border-color: #c7d2fe;
            color: #1e1b4b;
            background: #eef2ff;
        }

        .data-metrics-list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .metric-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.55rem;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            background: #fbfcff;
        }

        .metric-row input[type="checkbox"] {
            accent-color: #4338ca;
        }

        .metric-title {
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            flex: 1;
        }

        .metric-stat {
            font-size: 11px;
            font-weight: 700;
            color: #1e1b4b;
            background: #eef2ff;
            border-radius: 999px;
            padding: 0.12rem 0.45rem;
        }

        .metric-addon {
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            background: #ffffff;
            color: #6b7280;
            font-size: 11px;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .metric-addon.is-active {
            border-color: #22c55e;
            color: #065f46;
            background: #ecfdf5;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.14);
        }

        .metric-addon.is-disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .metrics-selection-hint {
            margin-top: 0.65rem;
            font-size: 12px;
            color: #6b7280;
        }

        .metrics-selection-hint.is-error {
            color: #b91c1c;
        }

        .dql-warning {
            margin-top: 0.6rem;
            border: 1px solid #fbbf24;
            background: #fffbeb;
            color: #92400e;
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            font-size: 12px;
            line-height: 1.4;
        }

        .dql-warning.is-hidden {
            display: none;
        }

        .dql-warning label {
            display: flex;
            align-items: flex-start;
            gap: 0.45rem;
            margin-top: 0.45rem;
            color: #7c2d12;
            font-weight: 600;
        }

        .range-warning {
            margin-top: 0.6rem;
            border: 1px solid #fbbf24;
            background: #fffbeb;
            color: #92400e;
            border-radius: 10px;
            padding: 0.6rem 0.75rem;
            font-size: 12px;
            line-height: 1.4;
        }

        .range-warning.is-hidden {
            display: none;
        }

        .range-warning label {
            display: flex;

        .multi-select-search input {

        .multi-select-options {

            flex-wrap: wrap;
            gap: 0.35rem;

        .filter-choice {

        .filter-option.is-active {

            background: #eef2ff;
            color: #1e1b4b;
        }

        .selection-inline-row {

            color: #3a3b45;

            border: 1px solid #e7e7e7;
            border-radius: 8px;

            background: #ffffff;

        .selection-grid select {

        .selection-inline-item {

        .custom-select {

        .custom-select__trigger {

            justify-content: space-between;
            border: 1px solid #e7e7e7;

            color: #166534;
            background: #ecfdf5;
        }

        .custom-select__option {
            width: 100%;
            text-align: left;
            border: none;

            padding: 0.4rem 0.6rem;
            border-radius: 8px;

        .custom-select__option.is-active,

            background: #f3f4f6;
        }

        .custom-select__footer {
            margin-top: 0.5rem;

        .custom-select__input {

            padding: 0.45rem 0.6rem;

        .selection-inline-row select.is-placeholder {
            color: #9ca3af;
        }

        .selection-inline-row option.is-muted {
            color: #9ca3af;
        }

        .selection-inline-row select.is-muted-value {
            color: #9ca3af;
        }

        .selection-inline-row select.is-range-selected {

            color: #6d28d9;

        .selection-inline-row select.is-value-selected,

        .selection-actions {

        .map-filter-select {

        .map-body {
            position: relative;
            flex: 1;
            min-height: 0;
            height: 100%;
        }

        .map-canvas {
            position: relative;
            height: 100%;
            min-height: 0;
            background: linear-gradient(120deg, rgba(102, 78, 224, 0.08), rgba(18, 97, 160, 0.12));
        }

        .map-body .leaflet-container {
            height: 100% !important;
        }

        .leaflet-draw-toolbar,

            right: 1rem;
            align-items: flex-end;

            display: inline-flex;

            color: #4d29b5;

            font-size: 12px;
            box-shadow: 0 8px 18px #4c29b537;

            border-color: #664EE0;
            background: #f0f3ff;
            color: #4b3bbf;
            box-shadow: 0 8px 18px rgba(102, 78, 224, 0.2);

        .map-overlay-button.is-hidden {

        .modal-backdrop {

            justify-content: center;
            z-index: 2000;

        .welcome-input-container {
            width: 100%;
        }

        .location-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

            font-size: 12px;

            letter-spacing: 0.08em;
            color: #6c757d;
            font-weight: 600;

        .chat-container.initial .chat-input-container {
            display: none;
        }

        @media (max-width: 768px) {
            .map-canvas {
                height: 100%;
                min-height: 0;

                padding: 0;
            }

            .map-toolbar {
                grid-template-columns: 1fr;
                gap: 0.75rem;

            .map-toolbar-actions {
                justify-content: space-between;

            border-top: 1px solid #e7e7e7;

            gap: 0.5rem;
            align-items: flex-end;

        .chat-input {

            border: 1px solid #e7e7e7;
            border-radius: 20px;
            font-size: 13px;

            resize: none;
            min-height: 36px;
            max-height: 100px;
            font-family: inherit;

            height: 18px;

            color: #856404;

        .navigation-wrap {
            min-width: 50%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .navigation-wrap ul {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-end;
            list-style: none;
        }

        .navigation-wrap ul li {
            width: 3.125rem;
            height: 3.125rem;
            display: flex;
            align-items: center;
            justify-content: center;
            list-style: none;
            margin-bottom: 0;
        }

            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;

            border-radius: 0.5rem;
            position: relative;

            right: 10px;
            width: 12px;
            height: 12px;
            background-color: #ef4444;
            border-radius: 50%;

            background: #f8f9fa;

            grid-template-columns: repeat(2, minmax(0, 1fr));

        .message.user.summary-bubble .selection-actions {
            margin-top: 0.5rem;
        }

            color: #111827;
            border: 1px solid #e5e7eb;

        .message.user.dql-user-summary .dql-summary-card {
            background: #ffffff;
            border-color: #e5e7eb;

        }

        .message.user.dql-user-summary .message-time {
            color: #6b7280;
            opacity: 1;
        }

        .btn-icon {
            padding: 0.4rem;
            background: none;
            border: 1px solid #e7e7e7;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            'district_name',

        ];

        function setActiveToggle(mode) {
            const toggleButton = document.getElementById('modeToggleBtn');
            const titleLabel = document.querySelector('.map-toolbar-title');
            const isZones = mode === 'zones';
            if (toggleButton) {
                toggleButton.textContent = isZones ? 'Draw zone' : 'Select zone';
            }
            if (titleLabel) {
                titleLabel.textContent = isZones ? 'Select zones' : 'Draw zone';
            }
        }

        function enableDrawMode() {
            if (!trustMap || !drawControl) return;
            if (!trustMap.hasLayer(drawnItems)) {
                trustMap.addLayer(drawnItems);
            }
            setActiveToggle('draw');
            if (districtsLayer && trustMap.hasLayer(districtsLayer)) {
                trustMap.removeLayer(districtsLayer);
            }
            removeMunicipalitiesLayer();
            if (selectedDistrictLayer && districtsLayer) {
                districtsLayer.resetStyle(selectedDistrictLayer);
                selectedDistrictLayer = null;
                selectedAreaLabel = '';
            }
            if (drawHandler) drawHandler.enable();
        }

        function enableZonesMode() {
            if (!trustMap) return;
            setActiveToggle('zones');
            if (districtsLayer && !trustMap.hasLayer(districtsLayer)) {
                trustMap.addLayer(districtsLayer);
            }
            if (drawHandler) drawHandler.disable();
            if (drawnItems) {
                drawnItems.clearLayers();
            }
            removeMunicipalitiesLayer();
            const usePolygonBtn = document.getElementById('usePolygonBtn');
            if (usePolygonBtn) usePolygonBtn.classList.add('is-hidden');
        }

        function highlightDistrict(layer) {
            if (selectedDistrictLayer && districtsLayer) {
                districtsLayer.resetStyle(selectedDistrictLayer);
            }
            selectedDistrictLayer = layer;
            layer.setStyle({
                weight: 2,
                color: '#664EE0',
                fillColor: '#664EE0',
                fillOpacity: 0.35
            });
            if (trustMap && layer.getBounds) {
                trustMap.fitBounds(layer.getBounds(), { padding: [20, 20] });
            }
            const name = layer.feature && layer.feature.properties
                ? (layer.feature.properties.name || layer.feature.properties.NAME_1 || layer.feature.properties.district || layer.feature.properties.NAME || '')
                : '';
            selectedAreaLabel = name ? `${name} district` : 'selected district';
            selectedAreaType = 'district';
            const usePolygonBtn = document.getElementById('usePolygonBtn');
            if (usePolygonBtn) {
                usePolygonBtn.textContent = 'Use selected district';
                usePolygonBtn.classList.remove('is-hidden');
            }
            if (name) {
                loadMunicipalitiesForDistrict(name, layer);
            }
        }

        function resetSelections() {
            if (selectedDistrictLayer && districtsLayer) {
                districtsLayer.resetStyle(selectedDistrictLayer);
            }
            selectedDistrictLayer = null;
            selectedAreaLabel = '';
            selectedAreaType = '';
            if (drawnItems) {
                drawnItems.clearLayers();
            }
            removeMunicipalitiesLayer();
            const usePolygonBtn = document.getElementById('usePolygonBtn');
            if (usePolygonBtn) {
                usePolygonBtn.classList.add('is-hidden');
            }
            if (drawControl) {
                drawControl.setDrawingOptions({
                    polygon: {
                        allowIntersection: false,
                        shapeOptions: {
                            color: '#e24aa5',
                            weight: 2,
                            fillColor: '#e24aa5',
                            fillOpacity: 0.25
                        }
                    }
                });
            }
            if (drawHandler) {
                drawHandler.disable();
            }
            if (trustMap && (!districtsLayer || !trustMap.hasLayer(districtsLayer))) {
                if (drawHandler) drawHandler.enable();
            }
        }

        function normalizeText(value) {
            return (value || '')
                .toString()
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();
        }

        function getPropertyValue(properties, keywords) {
            if (!properties) return '';
            const keys = Object.keys(properties);
            for (const keyword of keywords) {
                const match = keys.find(key => key.toLowerCase().includes(keyword));
                if (match && typeof properties[match] === 'string') {
                    return properties[match];
                }
            }
            return '';
        }

        function removeMunicipalitiesLayer() {
            if (municipalitiesLayer && trustMap && trustMap.hasLayer(municipalitiesLayer)) {
                trustMap.removeLayer(municipalitiesLayer);
            }
            municipalitiesLayer = null;
            selectedMunicipalityLayer = null;
        }

        function getMunicipalityName(properties) {
            return getPropertyValue(properties, ['concelho', 'municipality', 'muni', 'name', 'nom']);
        }

        function getDistrictName(properties) {
            return getPropertyValue(properties, ['distrito', 'district', 'adm1', 'district_name', 'districtname', 'district_name', 'districtname']);
        }

        function featureIntersectsBounds(feature, bounds) {
            if (!feature || !bounds || !window.L) return false;
            try {
                const featureLayer = L.geoJSON(feature);
                const featureBounds = featureLayer.getBounds();
                return bounds.intersects(featureBounds);
            } catch (error) {
                return false;
            }
        }

        function buildMunicipalityQueryUrl(base, field, value) {
            const query = `${field} = \"${value}\"`;
            return `${base}?where=${encodeURIComponent(query)}`;
        }

        function buildMunicipalityRecordsUrl(base, field, value) {
            const query = `${field} = \"${value}\"`;
            return `${base}/records?where=${encodeURIComponent(query)}&limit=1000`;
        }

        function recordsToGeoJson(data) {
            if (!data || !Array.isArray(data.results)) return null;
            const features = data.results.map(result => {
                const properties = result || {};
                const geometry = result.geo_shape?.geometry || result.geo_shape || result.geometry || null;
                if (!geometry) return null;
                return {
                    type: 'Feature',
                    geometry,
                    properties
                };
            }).filter(Boolean);
            if (!features.length) return null;
            return {
                type: 'FeatureCollection',
                features
            };
        }

        function loadMunicipalitiesForDistrict(districtName, districtLayer) {
            const normalizedDistrict = normalizeText(districtName);
            const districtBounds = districtLayer && districtLayer.getBounds ? districtLayer.getBounds() : null;
            const applyMunicipalities = () => {
                if (!municipalitiesData || !trustMap) return;
                removeMunicipalitiesLayer();
                const filtered = {
                    type: 'FeatureCollection',
                    features: municipalitiesData.features.filter(feature => {
                        const props = feature.properties || {};
                        const district = getDistrictName(props);
                        const nameMatch = normalizeText(district) === normalizedDistrict;
                        if (nameMatch) return true;
                        return featureIntersectsBounds(feature, districtBounds);
                    })
                };
                if (!filtered.features.length) return;
                municipalitiesLayer = L.geoJSON(filtered, {
                    style: {
                        color: '#4b5563',
                        weight: 1,
                        fillColor: '#c7b9ff',
                        fillOpacity: 0.2
                    },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', () => {
                            if (selectedMunicipalityLayer && municipalitiesLayer) {
                                municipalitiesLayer.resetStyle(selectedMunicipalityLayer);
                            }
                            selectedMunicipalityLayer = layer;
                            layer.setStyle({
                                color: '#5b3df5',
                                weight: 2,
                                fillColor: '#5b3df5',
                                fillOpacity: 0.3
                            });
                            const municipalityName = getMunicipalityName(feature.properties) || 'selected municipality';
                            selectedAreaLabel = `${municipalityName} municipality`;
                            selectedAreaType = 'municipality';
                            const usePolygonBtn = document.getElementById('usePolygonBtn');
                            if (usePolygonBtn) {
                                usePolygonBtn.textContent = 'Use selected municipality';
                                usePolygonBtn.classList.remove('is-hidden');
                            }
                            if (trustMap && layer.getBounds) {
                                trustMap.fitBounds(layer.getBounds(), { padding: [20, 20] });
                            }
                        });
                    }
                }).addTo(trustMap);
            };

            if (municipalitiesData) {
                applyMunicipalities();
                return;
            }

            const querySources = [];
            MUNICIPALITY_DATASETS.forEach(source => {
                MUNICIPALITY_DISTRICT_FIELDS.forEach(field => {
                    querySources.push(buildMunicipalityRecordsUrl(source, field, districtName));
                });
            });

            const tryQueryFetch = (index) => {
                if (index >= querySources.length) {
                    tryFullFetch(0);
                    return;
                }
                fetch(querySources[index])
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to load municipalities');
                        return response.json();
                    })
                    .then(data => {
                        const geojson = recordsToGeoJson(data);
                        if (geojson && geojson.features.length) {
                            municipalitiesData = geojson;
                            applyMunicipalities();
                        } else {
                            tryQueryFetch(index + 1);
                        }
                    })
                    .catch(() => {
                        tryQueryFetch(index + 1);
                    });
            };

            const tryFullFetch = (index) => {
                if (index >= MUNICIPALITY_DATASETS.length) return;
                fetch(`${MUNICIPALITY_DATASETS[index]}/exports/geojson`)
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to load municipalities');
                        return response.json();
                    })
                    .then(data => {
                        municipalitiesData = data;
                        applyMunicipalities();
                    })
                    .catch(() => {
                        tryFullFetch(index + 1);
                    });
            };

            tryQueryFetch(0);
        }

                        const yearPct = usage.last12 ? Math.round((usage.last12 / groupYearMax) * 100) : 0;
                        const semesterPct = usage.last6 ? Math.round((usage.last6 / groupSemesterMax) * 100) : 0;
                        const quarterPct = usage.last3 ? Math.round((usage.last3 / groupQuarterMax) * 100) : 0;
                        const monthPct = usage.last1 ? Math.round((usage.last1 / groupMonthMax) * 100) : 0;
                        const optionList = (entry.options?.length ? entry.options : ['Yes', 'No']).filter(option => {
                            if (!entry.search) return true;
                            return option.toLowerCase().includes(entry.search.toLowerCase());
                        });
                        return `
                            <div class="filter-option ${active ? 'is-active' : ''} ${isOpenRow ? 'is-open' : ''}" data-group="${group.id}" data-key="${field.key}">
                                <div class="filter-option-head">
                                    <div class="filter-option-label">${field.label}</div>
                                    ${usageLabel ? `
                                        <span class="filter-usage" style="--usage-color:${color}">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                <path d="M3 3v18h18"/>
                                                <path d="M7 14l4-4 4 3 4-6"/>
                                            </svg>
                                            ${usageLabel}
                                            <span class="usage-detail">
                                                <div class="usage-detail-row">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                        <path d="M3 3v18h18"/>
                                                        <path d="M7 14l4-4 4 3 4-6"/>
                                                    </svg>
                                                    <span class="usage-detail-label">Last year</span>
                                                    <span>${yearPct}%</span>
                                                    <span>${formatUsageCount(usage.last12)}</span>
                                                </div>
                                                <div class="usage-detail-row">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                        <path d="M3 3v18h18"/>
                                                        <path d="M7 14l4-4 4 3 4-6"/>
                                                    </svg>
                                                    <span class="usage-detail-label">Last semester</span>
                                                    <span>${semesterPct}%</span>
                                                    <span>${formatUsageCount(usage.last6)}</span>
                                                </div>
                                                <div class="usage-detail-row">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                        <path d="M3 3v18h18"/>
                                                        <path d="M7 14l4-4 4 3 4-6"/>
                                                    </svg>
                                                    <span class="usage-detail-label">Last quarter</span>
                                                    <span>${quarterPct}%</span>
                                                    <span>${formatUsageCount(usage.last3)}</span>
                                                </div>
                                                <div class="usage-detail-row">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                        <path d="M3 3v18h18"/>
                                                        <path d="M7 14l4-4 4 3 4-6"/>
                                                    </svg>
                                                    <span class="usage-detail-label">Last month</span>
                                                    <span>${monthPct}%</span>
                                                    <span>${formatUsageCount(usage.last1)}</span>
                                                </div>
                                            </span>
                                        </span>
                                    ` : ''}
                                    <span class="hint-chip">?
                                        <span class="hint-tooltip">${field.hint}</span>
                                    </span>
                                </div>
                                <div class="filter-option-body">
                                    ${field.type === 'numeric' ? `
                                        <div class="filter-option-body-row">
                                            <input type="number" placeholder="Min" value="${entry.min || ''}" data-role="min">
                                            <input type="number" placeholder="Max" value="${entry.max || ''}" data-role="max">
                                        </div>
                                    ` : `
                                        <div class="multi-select">
                                            <div class="multi-select-chips">
                                                ${(entry.values || []).map(value => `
                                                    <span class="multi-select-chip">
                                                        ${value}
                                                        <button type="button" data-chip-remove="${value}">×</button>
                                                    </span>
                                                `).join('')}
                                            </div>
                                            <div class="multi-select-search">
                                                <input type="text" placeholder="Search" value="${entry.search || ''}" data-role="search">
                                            </div>
                                            <div class="multi-select-options">
                                                ${optionList.map(option => `
                                                    <button class="filter-choice ${entry.values?.includes(option) ? 'is-active' : ''}" type="button" data-option="${option}">${option}</button>
                                                `).join('')}
                                            </div>
                                        </div>
                                    `}
                                </div>
                            </div>
                        `;
                    }).join('');
                    return `
                        <div class="filters-group" data-group="${group.id}">
                            <div class="filters-group-header">
                                <span class="filters-group-header-left">
                                    ${group.label}
                                    ${selectedPills}
                                </span>
                                <button class="filters-group-toggle" type="button" data-group-toggle="${group.id}">${isOpen ? '-' : '+'}</button>
                            </div>
                            <div class="filters-group-body" style="${isOpen ? '' : 'display: none;'}">
                                ${options}
                            </div>
                        </div>
                    `;
                }).join('');
            };

            additionalFiltersToggle?.addEventListener('click', () => {
                const isOpen = additionalFiltersToggle.classList.toggle('is-open');
                additionalFiltersPanel?.classList.toggle('is-hidden', !isOpen);
                additionalFiltersToggle.querySelector('span')?.replaceChildren(document.createTextNode(isOpen ? '-' : '+'));
            });

            additionalFiltersSearch?.addEventListener('input', (event) => {
                const value = event.target.value || '';
                if (!value.trim()) {
                    openGroups.clear();
                    openFilterKey = '';
                }
                renderFilterGroups(value);
            });

            additionalFiltersPanel?.addEventListener('mouseleave', () => {
                openFilterKey = '';
                renderFilterGroups(additionalFiltersSearch?.value || '');
            });

            additionalFiltersGroups?.addEventListener('click', (event) => {
                const groupToggle = event.target.closest('[data-group-toggle]');
                if (groupToggle) {
                    const groupId = groupToggle.getAttribute('data-group-toggle');
                    if (openGroups.has(groupId)) {
                        openGroups.delete(groupId);
                    } else {
                        openGroups.add(groupId);
                    }
                    renderFilterGroups(additionalFiltersSearch?.value || '');
                    return;
                }
                const groupPill = event.target.closest('[data-group-pill]');
                if (groupPill) {
                    const groupId = groupPill.getAttribute('data-group-pill');
                    const key = groupPill.getAttribute('data-key');
                    updateFilterEntry(groupId, key, entry => {
                        if (entry.type === 'numeric') {
                            return { ...entry, min: '', max: '' };
                        }
                        return { ...entry, values: [] };
                    });
                    renderFilterGroups(additionalFiltersSearch?.value || '');
                    return;
                }
                const optionRow = event.target.closest('.filter-option');
                if (!optionRow) return;
                if (event.target.closest('.hint-chip')) return;
                const groupId = optionRow.getAttribute('data-group');
                const key = optionRow.getAttribute('data-key');
                const group = RESO_GROUPS.find(item => item.id === groupId);
                const field = group?.fields.find(item => item.key === key);
                if (!group || !field) return;
                if (event.target.closest('.filter-choice')) {
                    const choice = event.target.closest('.filter-choice');
                    const optionValue = choice.getAttribute('data-option');
                    updateFilterEntry(groupId, key, entry => {
                        const currentValues = entry.values || [];
                        const nextValues = currentValues.includes(optionValue)
                            ? currentValues.filter(value => value !== optionValue)
                            : [...currentValues, optionValue];
                        return { ...entry, values: nextValues };
                    });
                    renderFilterGroups(additionalFiltersSearch?.value || '');
                    return;
                }
                if (event.target.closest('[data-chip-remove]')) {
                    const value = event.target.closest('[data-chip-remove]').getAttribute('data-chip-remove');
                    updateFilterEntry(groupId, key, entry => ({
                        ...entry,
                        values: (entry.values || []).filter(item => item !== value)
                    }));
                    renderFilterGroups(additionalFiltersSearch?.value || '');
                    return;
                }
                if (event.target.closest('.filter-option-head')) {
                    const nextKey = `${groupId}:${key}`;
                    openFilterKey = openFilterKey === nextKey ? '' : nextKey;
                    renderFilterGroups(additionalFiltersSearch?.value || '');
                }
            });

            additionalFiltersGroups?.addEventListener('input', (event) => {
                const optionRow = event.target.closest('.filter-option');
                if (!optionRow) return;
                const groupId = optionRow.getAttribute('data-group');
                const key = optionRow.getAttribute('data-key');
                const role = event.target.getAttribute('data-role');
                if (!role) return;
                const value = event.target.value;
                if (role === 'search') {
                    updateFilterEntry(groupId, key, entry => ({ ...entry, search: value }));
                    const optionsWrap = optionRow.querySelector('.multi-select-options');
                    if (optionsWrap) {
                        const term = value.toLowerCase();
                        optionsWrap.querySelectorAll('.filter-choice').forEach(button => {
                            const optionText = (button.textContent || '').toLowerCase();
                            button.style.display = optionText.includes(term) ? 'inline-flex' : 'none';
                        });
                    }
                    return;
                } else if (role === 'min' || role === 'max') {
                    updateFilterEntry(groupId, key, entry => ({ ...entry, [role]: value }));
                    const entry = (flowSelections.additionalFilters || []).find(item => item.group === groupId && item.key === key);
                    const isActive = entry ? isEntryActive(entry) : Boolean(value);
                    optionRow.classList.toggle('is-active', isActive);
                }
            });

            const closeAllSelects = () => {
                wrapper.querySelectorAll('.custom-select').forEach(select => {
                    select.classList.remove('is-open');
                });
            };

            const openSelect = (select) => {
                closeAllSelects();
                select.classList.add('is-open');
            };

            const setSelectValue = (select, value, label) => {
                select.dataset.value = value;
                const trigger = select.querySelector('.custom-select__trigger');
                const text = trigger?.querySelector('span');
                if (text) text.textContent = label;
                trigger?.classList.toggle('is-placeholder', !value);
                trigger?.classList.toggle('is-value-selected', Boolean(value));
            };

            const formatErrorValue = (value, suffix) => {
                if (value === null || value === undefined) return null;
                return suffix ? `${value} ${suffix}` : `${value}`;
            };

            const buildCustomInputError = (mode, bounds, pairValue, suffix) => {
                const minBound = bounds?.min ?? null;
                const maxBound = bounds?.max ?? null;
                const minValue = mode === 'max' && pairValue !== null ? pairValue : minBound;
                const maxValue = mode === 'min' && pairValue !== null ? pairValue : maxBound;
                const minLabel = formatErrorValue(minValue, suffix);
                const maxLabel = formatErrorValue(maxValue, suffix);
                if (minLabel && maxLabel) {
                    return `Enter a value between ${minLabel} and ${maxLabel}.`;
                }
                if (minLabel) {
                    return `Enter a value of at least ${minLabel}.`;
                }
                if (maxLabel) {
                    return `Enter a value of at most ${maxLabel}.`;
                }
                return 'Enter a valid number.';
            };

            const initCustomSelect = (select, options, placeholder, allowCustomInput, pairSelector, pairMode, valueBounds, formatSuffix) => {
                const triggerHtml = `
                    <button type="button" class="custom-select__trigger is-placeholder">
                        <span>${placeholder}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                `;
                const optionsHtml = options.map(option => `
                    <button class="custom-select__option" type="button" data-value="${option.value}" data-number="${option.number ?? ''}">${option.label}</button>
                `).join('');
                const footerHtml = allowCustomInput ? `
                    <div class="custom-select__footer">
                        <input class="custom-select__input" type="number" placeholder="Other">
                        <div class="custom-select__error" style="display: none;"></div>
                        <button class="custom-select__ok" type="button">Ok</button>
                    </div>
                ` : '';
                select.innerHTML = `
                    ${triggerHtml}
                    <div class="custom-select__panel">
                        <div class="custom-select__options">${optionsHtml}</div>
                        ${footerHtml}
                    </div>
                `;

                const trigger = select.querySelector('.custom-select__trigger');
                const optionsWrap = select.querySelector('.custom-select__options');
                const input = select.querySelector('.custom-select__input');
                const okButton = select.querySelector('.custom-select__ok');
                const error = select.querySelector('.custom-select__error');
                select.dataset.options = JSON.stringify(options);
                if (input && valueBounds) {
                    input.min = String(valueBounds.min);
                    input.max = String(valueBounds.max);
                    input.step = '1';
                }

                trigger.addEventListener('click', () => {
                    if (select.classList.contains('is-open')) {
                        select.classList.remove('is-open');
                    } else {
                        openSelect(select);
                    }
                });

                optionsWrap.addEventListener('click', (event) => {
                    const button = event.target.closest('.custom-select__option');
                    if (!button) return;
                    const value = button.getAttribute('data-value') || '';
                    setSelectValue(select, value, button.textContent || value);
                    select.classList.remove('is-open');
                    updateSelections();
                    if (pairSelector) {
                        const pair = wrapper.querySelector(pairSelector);
                        if (pair) applyPairConstraints(select, pair, pairMode);
                    }
                    if (pairSelector) {
                        const pair = wrapper.querySelector(pairSelector);
                        if (pair && !pair.dataset.value) {
                            openSelect(pair);
                        }
                    }
                });

                if (okButton && input) {
                    input.addEventListener('input', () => {
                        const value = input.value.trim();
                        const pair = pairSelector ? wrapper.querySelector(pairSelector) : null;
                        const pairValue = pair ? parseNumericValue(pair.dataset.value) : null;
                        if (!value) {
                            input.classList.remove('is-invalid');
                            if (error) error.style.display = 'none';
                            return;
                        }
                        if (!isOtherValueValid(value, options, pairMode, valueBounds, pairValue)) {
                            input.classList.add('is-invalid');
                            if (error) {
                                error.textContent = buildCustomInputError(pairMode, valueBounds, pairValue, formatSuffix);
                                error.style.display = 'block';
                            }
                        } else {
                            input.classList.remove('is-invalid');
                            if (error) error.style.display = 'none';
                        }
                    });
                    okButton.addEventListener('click', () => {
                        const value = input.value.trim();
                        if (!value) return;
                        const pair = pairSelector ? wrapper.querySelector(pairSelector) : null;
                        const pairValue = pair ? parseNumericValue(pair.dataset.value) : null;
                        if (!isOtherValueValid(value, options, pairMode, valueBounds, pairValue)) {
                            input.classList.add('is-invalid');
                            if (error) {
                                error.textContent = buildCustomInputError(pairMode, valueBounds, pairValue, formatSuffix);
                                error.style.display = 'block';
                            }
                            return;
                        }
                        const displayValue = formatSuffix ? `${value} ${formatSuffix}` : value;
                        setSelectValue(select, value, displayValue);
                        select.classList.remove('is-open');
                        input.value = '';
                        input.classList.remove('is-invalid');
                        if (error) error.style.display = 'none';
                        updateSelections();
                        if (pairSelector) {
                            const pair = wrapper.querySelector(pairSelector);
                            if (pair) applyPairConstraints(select, pair, pairMode);
                        }
                        if (pairSelector) {
                            const pair = wrapper.querySelector(pairSelector);
                            if (pair && !pair.dataset.value) {
                                openSelect(pair);
                            }
                        }
                    });
                }

                setSelectValue(select, '', placeholder);
            };

            const parseNumericValue = (value) => {
                if (!value) return null;
                if (value === 'No limit') return null;
                const number = Number(String(value).replace(/[^\d.]/g, ''));
                return Number.isFinite(number) ? number : null;
            };

            const isOtherValueValid = (value, options, mode, bounds, pairValue) => {
                const num = parseNumericValue(value);
                if (num === null) return false;
                if (bounds && (num < bounds.min || num > bounds.max)) return false;
                const numericOptions = options
                    .map(option => option.number ?? parseNumericValue(option.value))
                    .filter(option => option !== null);
                if (!numericOptions.length) return true;
                const min = Math.min(...numericOptions);
                const max = Math.max(...numericOptions);
                if (mode === 'min') {
                    if (pairValue !== null && num > pairValue) return false;
                    return num >= min;
                }
                if (mode === 'max') {
                    if (pairValue !== null && num < pairValue) return false;
                    return num <= max;
                }
                return num >= min && num <= max;
            };

            const applyPairConstraints = (source, target, mode) => {
                if (!source || !target) return;
                const options = JSON.parse(target.dataset.options || '[]');
                const sourceVal = parseNumericValue(source.dataset.value);
                if (sourceVal === null) {
                    rebuildOptions(target, options);
                    return;
                }
                const filtered = options.filter(option => {
                    if (option.value === 'No limit') return mode === 'min';
                    if (option.value === '__other__') return true;
                    const num = option.number ?? parseNumericValue(option.value);
                    if (num === null) return true;
                    return mode === 'min' ? num >= sourceVal : num <= sourceVal;
                });
                rebuildOptions(target, filtered);
            };

            const rebuildOptions = (select, options) => {
                const optionsHtml = options.map(option => `
                    <button class="custom-select__option" type="button" data-value="${option.value}" data-number="${option.number ?? ''}">${option.label}</button>
                `).join('');
                const panel = select.querySelector('.custom-select__panel');
                if (!panel) return;
                const optionsWrap = select.querySelector('.custom-select__options');
                if (optionsWrap) optionsWrap.innerHTML = optionsHtml;
            };

            const propertyTypes = ['Residential', 'Commercial', 'Land', 'Mixed-use']
                .map(value => ({ value, label: value }));
            const propertySubTypes = ['Apartment', 'House', 'Townhouse', 'Retail', 'Office', 'Industrial', 'Plot']
                .map(value => ({ value, label: value }));
            const bedOptions = Array.from({ length: 11 }, (_, i) => ({ value: String(i), label: String(i), number: i }));
            const bathOptions = Array.from({ length: 11 }, (_, i) => ({ value: String(i), label: String(i), number: i }));
            const lotValues = [20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 250, 300, 350, 400, 450, 500, 600, 700, 800, 900];
            const lotOptions = [
                ...lotValues.map(value => ({ value: `${value}`, label: `${value} m²`, number: value })),
                { value: 'No limit', label: 'No limit' }
            ];
            const currentYear = new Date().getFullYear();
            const decadeStart = Math.floor(currentYear / 10) * 10;
            const decadeValues = [];
            for (let year = decadeStart; year >= 1900; year -= 10) {
                decadeValues.push(year);
            }
            const yearValues = [currentYear, ...decadeValues, 1800, 1700, 1500];
            const yearOptionsMin = [
                ...yearValues.map(value => ({
                    value: `${value}`,
                    label: value === currentYear ? 'Current Year' : `${value}`,
                    number: value
                })),
                { value: 'No limit', label: '< 1500' }
            ];
            const yearOptionsMax = [
                { value: `${currentYear}`, label: 'Current Year', number: currentYear },
                ...yearValues.filter(value => value !== currentYear).map(value => ({ value: `${value}`, label: `${value}`, number: value }))
            ];

            initCustomSelect(wrapper.querySelector('#selPropertyType'), propertyTypes, 'Select', false);
            initCustomSelect(wrapper.querySelector('#selPropertySubType'), propertySubTypes, 'Select', false);
            initCustomSelect(wrapper.querySelector('#selBedroomsMin'), bedOptions, 'Min', false, '#selBedroomsMax', 'min');
            initCustomSelect(wrapper.querySelector('#selBedroomsMax'), bedOptions, 'Max', false, '#selBedroomsMin', 'max');
            initCustomSelect(wrapper.querySelector('#selBathroomsMin'), bathOptions, 'Min', false, '#selBathroomsMax', 'min');
            initCustomSelect(wrapper.querySelector('#selBathroomsMax'), bathOptions, 'Max', false, '#selBathroomsMin', 'max');
            initCustomSelect(wrapper.querySelector('#selLotMin'), lotOptions, 'Min', true, '#selLotMax', 'min', { min: 20, max: 900 }, 'm²');
            initCustomSelect(wrapper.querySelector('#selLotMax'), lotOptions, 'Max', true, '#selLotMin', 'max', { min: 20, max: 900 }, 'm²');
            initCustomSelect(wrapper.querySelector('#selYearBuiltMin'), yearOptionsMin, 'Min', true, '#selYearBuiltMax', 'min', { min: 1900, max: currentYear });
            initCustomSelect(wrapper.querySelector('#selYearBuiltMax'), yearOptionsMax, 'Max', true, '#selYearBuiltMin', 'max', { min: 1900, max: currentYear });

            wrapper.querySelectorAll('.field-usage').forEach(renderUsageBadge);

            renderFilterGroups('');

            const rangeAck = wrapper.querySelector('#rangeWarningAck');
            if (rangeAck) {
                rangeAck.addEventListener('change', updateStep2NextState);
            }

            const resetPair = (minSelector, maxSelector, minLabel, maxLabel) => {
                const minSelect = wrapper.querySelector(minSelector);
                const maxSelect = wrapper.querySelector(maxSelector);
                if (minSelect) setSelectValue(minSelect, '', minLabel);
                if (maxSelect) setSelectValue(maxSelect, '', maxLabel);
                updateSelections();
            };

            wrapper.querySelector('[data-reset=\"bedrooms\"]')?.addEventListener('click', () => {
                resetPair('#selBedroomsMin', '#selBedroomsMax', 'Min', 'Max');
            });

            wrapper.querySelector('[data-reset=\"bathrooms\"]')?.addEventListener('click', () => {
                resetPair('#selBathroomsMin', '#selBathroomsMax', 'Min', 'Max');
            });

            wrapper.querySelector('[data-reset=\"lot\"]')?.addEventListener('click', () => {
                resetPair('#selLotMin', '#selLotMax', 'Min', 'Max');
            });

            wrapper.querySelector('[data-reset=\"year\"]')?.addEventListener('click', () => {
                resetPair('#selYearBuiltMin', '#selYearBuiltMax', 'Min', 'Max');
            });

            document.addEventListener('click', (event) => {
                if (!wrapper.contains(event.target)) {
                    closeAllSelects();
                }
            });

            updateSelections();
            wrapper.querySelector('#nextToDataBtn')?.addEventListener('click', () => {
                const activeExtraFilters = (flowSelections.additionalFilters || []).filter(item => {
                    if (item.type === 'numeric') {
                        return Boolean(item.min || item.max);
                    }
                    return Array.isArray(item.values) && item.values.length > 0;
                });
                const extraPreview = activeExtraFilters.slice(0, 3).map(item => {
                    if (item.type === 'numeric') {
                        const min = item.min || 'Any';
                        const max = item.max || 'Any';
                        return `${escapeHtml(item.label)}: ${escapeHtml(min)}–${escapeHtml(max)}`;
                    }
                    const values = (item.values || []).slice(0, 3).join(', ') || 'Any';
                    return `${escapeHtml(item.label)}: ${escapeHtml(values)}`;
                });
                const summaryLines = [];
                if (flowSelections.propertyType || flowSelections.propertySubType) {
                    summaryLines.push(`Property: ${escapeHtml(flowSelections.propertyType || 'Any')} ${escapeHtml(flowSelections.propertySubType || '')}`.trim());
                }
                if (flowSelections.bedroomsMin || flowSelections.bedroomsMax) {
                    summaryLines.push(`Bedrooms: ${escapeHtml(flowSelections.bedroomsMin || '0')}–${escapeHtml(flowSelections.bedroomsMax || '10')}`);
                }
                if (flowSelections.bathroomsMin || flowSelections.bathroomsMax) {
                    summaryLines.push(`Bathrooms: ${escapeHtml(flowSelections.bathroomsMin || '0')}–${escapeHtml(flowSelections.bathroomsMax || '10')}`);
                }
                if (flowSelections.lotMin || flowSelections.lotMax) {
                    summaryLines.push(`Lot size: ${escapeHtml(flowSelections.lotMin || '0')}–${escapeHtml(flowSelections.lotMax || '5000')} m²`);
                }
                if (flowSelections.yearBuiltMin || flowSelections.yearBuiltMax) {
                    summaryLines.push(`Year built: ${escapeHtml(flowSelections.yearBuiltMin || String(yearStart))}–${escapeHtml(flowSelections.yearBuiltMax || String(yearEnd))}`);
                }
                if (activeExtraFilters.length) {
                    summaryLines.push(`Additional filters:`);
                    summaryLines.push(...extraPreview.map(line => `${line}`));
                    if (activeExtraFilters.length > 3) summaryLines.push('…');
                }
                const summary = summaryLines.length ? summaryLines.join('<br>') : 'No filters selected';
                renderStepSummary(wrapper, 3, 'Characteristics', summary, handleEditStep);
                appendAIMessage('Great, now pick the data metrics you want to include.', 4);
                appendStepDataTypes();
            });

            wrapper.querySelector('#cancelFlowBtn')?.addEventListener('click', () => {
                resetFlow();
                wrapper.remove();
            });
        }

        function appendStepDataTypes() {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';
            wrapper.setAttribute('data-step', '3');
            wrapper.innerHTML = `

                        { key: 'deed_price', label: 'Deed (registry) prices', hint: 'Recorded registry price at close.' },
                        { key: 'purchase_agreement_price', label: 'Purchase agreement prices', hint: 'Contract price at signing.' },
                        { key: 'price_delta', label: 'Discount vs asking', hint: 'Delta between asking and closing price.' }
                    ]
                },
                open_data: {
                    label: 'Open data',
                    description: 'Official statistics tied to zoning, permits, and public services.',
                    metrics: [

                        { key: 'permits', label: 'Permits activity', hint: 'Issued vs pending permits and approval timelines.' },
                        { key: 'planning_pipeline', label: 'Planning pipeline', hint: 'Municipal plans affecting the area.' },
                        { key: 'public_services', label: 'Public services coverage', hint: 'Schools, healthcare, and transit proximity.' },
                        { key: 'area_stats', label: 'Area statistics', hint: 'Population density, crime, and livability indicators.' },
                        { key: 'environmental_risk', label: 'Environmental risk', hint: 'Flood, seismic, or coastal risk flags.' }
                    ]
                },

                    label: 'Demographics',
                    description: 'Buyer, renter, and seller profiles derived from transaction data.',

                        { key: 'buyer_nationality', label: 'Buyer nationality mix', hint: 'Nationality and residency profiles.' },

            const getCategoryCount = (key) => {
                ensureCategory(key);
                return Object.keys(flowSelections.dataMetrics[key]).length;

            const getTotalSelected = () => {

            const updateNextState = () => {

                if (hint) {
                    hint.classList.toggle('is-error', !hasSelection);
                    hint.textContent = hasSelection

            const updateSelections = () => {
                flowSelections.dataTypes = categoryKeys.filter(key => getCategoryCount(key) > 0).map(key => DATA_METRICS[key].label);

                updateNextState();
                renderTabs();

            const renderTabs = () => {
                if (!tabs) return;
                tabs.innerHTML = categoryKeys.map(key => {
                    const count = getCategoryCount(key);
                    const label = count ? `${DATA_METRICS[key].label} (${count})` : DATA_METRICS[key].label;
                    return `<button class="data-category-tab ${key === activeCategory ? 'is-active' : ''}" type="button" data-category="${key}">${label}</button>`;

            const renderMetrics = (key) => {

                ensureCategory(key);
