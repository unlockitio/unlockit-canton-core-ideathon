                list.innerHTML = category.metrics.map(metric => {

            const toggleMetric = (categoryKey, metricKey, isChecked) => {
                ensureCategory(categoryKey);
                if (isChecked) {
                    const metric = DATA_METRICS[categoryKey].metrics.find(item => item.key === metricKey);
                    flowSelections.dataMetrics[categoryKey][metricKey] = {
                        label: metric?.label || metricKey,
                        minMax: false
                    };
                } else {
                    delete flowSelections.dataMetrics[categoryKey][metricKey];
                }
                updateSelections();
                renderMetrics(categoryKey);
            };

            const toggleMinMax = (categoryKey, metricKey) => {
                ensureCategory(categoryKey);
                const metric = flowSelections.dataMetrics[categoryKey][metricKey];
                if (!metric) return;
                metric.minMax = !metric.minMax;
                updateSelections();
                renderMetrics(categoryKey);
            };

            tabs?.addEventListener('click', (event) => {
                const button = event.target.closest('.data-category-tab');
                if (!button) return;
                activeCategory = button.dataset.category || activeCategory;
                flowSelections.dataMetricsActive = activeCategory;
                renderTabs();
                renderMetrics(activeCategory);
            });

            list?.addEventListener('click', (event) => {
                const row = event.target.closest('.metric-row');
                if (!row) return;
                const categoryKey = row.dataset.category;
                const metricKey = row.dataset.metric;
                const button = event.target.closest('.metric-addon');
                if (button) {
                    toggleMinMax(categoryKey, metricKey);
                    return;
                }
                if (event.target.closest('.hint-chip')) return;
                const checkbox = row.querySelector('input[type="checkbox"]');
                if (!checkbox) return;
                if (event.target.matches('input[type="checkbox"]')) {
                    toggleMetric(categoryKey, metricKey, checkbox.checked);
                    return;
                }
                checkbox.checked = !checkbox.checked;
                toggleMetric(categoryKey, metricKey, checkbox.checked);
            });

            selectAllBtn?.addEventListener('click', () => {
                const category = DATA_METRICS[activeCategory];
                if (!category) return;
                category.metrics.forEach(metric => {
                    toggleMetric(activeCategory, metric.key, true);
                });
            });

            clearBtn?.addEventListener('click', () => {
                ensureCategory(activeCategory);
                flowSelections.dataMetrics[activeCategory] = {};
                updateSelections();
                renderMetrics(activeCategory);
            });

            renderTabs();
            renderMetrics(activeCategory);
            updateSelections();

            wrapper.querySelector('#nextToDqlBtn')?.addEventListener('click', () => {
                const categories = categoryKeys.filter(key => getCategoryCount(key) > 0);
                const summary = categories.length
                    ? categories.map(key => {
                        const count = getCategoryCount(key);
                        const minMaxCount = Object.values(flowSelections.dataMetrics[key] || {}).filter(item => item.minMax).length;
                        const minMaxText = minMaxCount ? `, ${minMaxCount} with Min/Max` : '';
                        return `<div><strong>${DATA_METRICS[key].label}</strong> — ${count} metrics${minMaxText}</div>`;
                    }).join('')
                    : 'Not specified';
                renderStepSummary(wrapper, 4, 'Data metrics', summary, handleEditStep);
                appendAIMessage('Choose the time series scope for the data.', 5);
                appendStepTimeSeries();
            });

            wrapper.querySelector('#cancelFlowBtn')?.addEventListener('click', () => {
                resetFlow();
                wrapper.remove();
            });
        }

        function appendStepTimeSeries() {

        function appendStepDql() {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';
            wrapper.setAttribute('data-step', '6');
            wrapper.innerHTML = `
                <div class="selection-form">
                    <div class="step-title">Step 6 of 7: Data quality (Range)</div>
                    <div class="selection-group dql-group">

                                <div class="dql-picker-title">Minimum</div>

                                <div class="dql-options" id="dqlMinOptions"></div>
                            </div>
                            <div class="dql-picker" data-role="max">
                                <div class="dql-picker-title">Maximum</div>
                                <div class="dql-current" id="dqlMaxCurrent" role="button" aria-expanded="false">
                                    <div class="dql-square" id="dqlMaxSquare">DQL4</div>
                                    <div>
                                        <div class="dql-current-title" id="dqlMaxTitle">Authority</div>
                                    </div>
                                    <span class="hint-tooltip dql-tooltip" id="dqlMaxTooltip"></span>

                                <div class="dql-options" id="dqlMaxOptions"></div>
                            </div>

                        <div class="dql-warning is-hidden" id="dqlWarning">

                                <input type="checkbox" id="dqlWarningAck">

                    </div>
                </div>
            `;
            chatMessages.appendChild(wrapper);

            const DQL_LEVELS = [
                { level: 0, name: 'DQL0', word: 'Unverified', color: '#C98F8F', textColor: '#FFFFFF', detail: 'Unverified data with no attestations.' },
                { level: 1, name: 'DQL1', word: 'Anchored', color: '#D6A08C', textColor: '#FFFFFF', detail: 'Anchored provenance with tamper-evident proof.' },
                { level: 2, name: 'DQL2', word: 'Attested', color: '#E4C38A', textColor: '#3A2F1B', detail: 'Attested by one authorized verifier or system of record.' },
                { level: 3, name: 'DQL3', word: 'Corroborated', color: '#C8D1B8', textColor: '#2E3A2E', detail: 'Corroborated by multiple independent confirmations.' },
                { level: 4, name: 'DQL4', word: 'Authority', color: '#9FB7B2', textColor: '#1F3A3A', detail: 'Authority-grade, regulated issuer plus freshness.' }
            ];

            const updateSelections = () => {
                updatePromptText();
                updateDqlWarning();
            };

            const updateDqlWarning = () => {
                const minVal = Number(flowSelections.dqlMin || 0);
                const warning = wrapper.querySelector('#dqlWarning');
                const ack = wrapper.querySelector('#dqlWarningAck');
                const nextButton = wrapper.querySelector('#nextToPriceBtn');
                const shouldWarn = minVal < 2;
                if (warning) warning.classList.toggle('is-hidden', !shouldWarn);
                if (ack && !shouldWarn) ack.checked = false;
                if (nextButton) {
                    nextButton.disabled = shouldWarn && !(ack && ack.checked);
                }
            };

            const renderDqlOptions = (role) => {
                const isMin = role === 'min';
                const optionsEl = wrapper.querySelector(isMin ? '#dqlMinOptions' : '#dqlMaxOptions');
                if (!optionsEl) return;
                const minVal = Number(flowSelections.dqlMin || 0);
                const maxVal = Number(flowSelections.dqlMax || 4);
                const filtered = DQL_LEVELS.filter(level => isMin ? level.level <= maxVal : level.level >= minVal);
                optionsEl.innerHTML = filtered.map(level => `
                    <div class="dql-option ${level.level === (isMin ? minVal : maxVal) ? 'is-active' : ''}" data-level="${level.level}">
                        <div class="dql-square" style="background:${level.color}; color:${level.textColor};">${level.name}</div>
                        <div>
                            <div class="dql-current-title">${level.word}</div>
                        </div>
                    </div>
                `).join('');
            };

            const updateCurrentCard = (role) => {
                const isMin = role === 'min';
                const levelValue = Number(isMin ? flowSelections.dqlMin || 0 : flowSelections.dqlMax || 4);
                const level = DQL_LEVELS.find(entry => entry.level === levelValue) || DQL_LEVELS[0];
                const square = wrapper.querySelector(isMin ? '#dqlMinSquare' : '#dqlMaxSquare');
                const title = wrapper.querySelector(isMin ? '#dqlMinTitle' : '#dqlMaxTitle');
                const tooltip = wrapper.querySelector(isMin ? '#dqlMinTooltip' : '#dqlMaxTooltip');
                if (square) {
                    square.textContent = level.name;
                    square.style.background = level.color;
                    square.style.color = level.textColor;
                }
                if (title) title.textContent = level.word;
                if (tooltip) tooltip.textContent = level.detail;
            };

            const toggleOptions = (role, forceOpen) => {
                const optionsEl = wrapper.querySelector(role === 'min' ? '#dqlMinOptions' : '#dqlMaxOptions');
                const currentEl = wrapper.querySelector(role === 'min' ? '#dqlMinCurrent' : '#dqlMaxCurrent');
                if (!optionsEl || !currentEl) return;
                const isOpen = optionsEl.classList.contains('is-open');
                const nextOpen = typeof forceOpen === 'boolean' ? forceOpen : !isOpen;
                optionsEl.classList.toggle('is-open', nextOpen);
                currentEl.setAttribute('aria-expanded', String(nextOpen));
            };

            const closeAllOptions = () => {
                toggleOptions('min', false);
                toggleOptions('max', false);
            };

            const bindPicker = (role) => {
                const isMin = role === 'min';
                const currentEl = wrapper.querySelector(isMin ? '#dqlMinCurrent' : '#dqlMaxCurrent');
                const optionsEl = wrapper.querySelector(isMin ? '#dqlMinOptions' : '#dqlMaxOptions');
                if (!currentEl || !optionsEl) return;
                currentEl.addEventListener('click', () => {
                    closeAllOptions();
                    renderDqlOptions(role);
                    toggleOptions(role, true);
                });
                optionsEl.addEventListener('click', (event) => {
                    const option = event.target.closest('.dql-option');
                    if (!option) return;
                    const value = option.getAttribute('data-level');
                    if (value === null) return;
                    if (isMin) {
                        flowSelections.dqlMin = value;
                        if (Number(flowSelections.dqlMax || 4) < Number(value)) {
                            flowSelections.dqlMax = value;
                        }
                    } else {
                        flowSelections.dqlMax = value;
                        if (Number(flowSelections.dqlMin || 0) > Number(value)) {
                            flowSelections.dqlMin = value;
                        }
                    }
                    updateCurrentCard('min');
                    updateCurrentCard('max');
                    updateSelections();
                    closeAllOptions();
                });
            };

            flowSelections.dqlMin = flowSelections.dqlMin || '0';
            flowSelections.dqlMax = flowSelections.dqlMax || '4';
            updateCurrentCard('min');
            updateCurrentCard('max');
            updateSelections();
            bindPicker('min');
            bindPicker('max');

            const ackCheckbox = wrapper.querySelector('#dqlWarningAck');
            if (ackCheckbox) {
                ackCheckbox.addEventListener('change', updateDqlWarning);
            }

            document.addEventListener('click', (event) => {
                if (!wrapper.contains(event.target)) {
                    closeAllOptions();
                    return;
                }
                const isInsidePicker = event.target.closest('.dql-picker');
                if (!isInsidePicker) {
                    closeAllOptions();
                }
            });

            wrapper.querySelector('#nextToPriceBtn')?.addEventListener('click', () => {
                const minLevel = DQL_LEVELS.find(entry => entry.level === Number(flowSelections.dqlMin || 0)) || DQL_LEVELS[0];
                const maxLevel = DQL_LEVELS.find(entry => entry.level === Number(flowSelections.dqlMax || 4)) || DQL_LEVELS[DQL_LEVELS.length - 1];
                const summaryHtml = `
                    <div class="dql-summary-cards">
                        <div class="dql-summary-card">
                            <div class="dql-square" style="background:${minLevel.color}; color:${minLevel.textColor};">${minLevel.name}</div>
                            <span>${minLevel.word}</span>
                        </div>
                        <div class="dql-summary-card">
                            <div class="dql-square" style="background:${maxLevel.color}; color:${maxLevel.textColor};">${maxLevel.name}</div>
                            <span>${maxLevel.word}</span>
                        </div>
                    </div>
                `;
                const summaryText = `DQL${flowSelections.dqlMin || 0}–DQL${flowSelections.dqlMax || 4}`;
                renderStepSummary(wrapper, 6, 'Data quality', summaryHtml, handleEditStep);
                appendAIMessage('Here is the price estimate based on your selections.', 7);
                appendStepPrice();
            });

            wrapper.querySelector('#cancelFlowBtn')?.addEventListener('click', () => {
                resetFlow();
                wrapper.remove();
            });
        }

        function appendStepPrice() {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';
            wrapper.setAttribute('data-step', '7');
            const walletBalance = 120;
            const metricWeights = {
                transactional: 1.6,
                demographics: 1.3,
                collective_intelligence: 1.15,
                open_data: 1.0
            };
            const metricPricing = () => {
                const metrics = flowSelections.dataMetrics || {};
                let total = 0;
                Object.keys(metrics).forEach(category => {
                    const weight = metricWeights[category] || 1.0;
                    Object.values(metrics[category] || {}).forEach(item => {
                        total += weight * 1;
                        if (item.minMax) total += weight * 1;
                    });
                });
                return total;
            };
            const filterPricing = () => {
                let total = 0;
                if (flowSelections.propertyType) total += 1;
                if (flowSelections.propertySubType) total += 1;
                if (flowSelections.bedroomsMin) total += 1;
                if (flowSelections.bedroomsMax) total += 1;
                if (flowSelections.bathroomsMin) total += 1;
                if (flowSelections.bathroomsMax) total += 1;
                if (flowSelections.lotMin) total += 1;
                if (flowSelections.lotMax) total += 1;
                if (flowSelections.yearBuiltMin) total += 1;
                if (flowSelections.yearBuiltMax) total += 1;
                (flowSelections.additionalFilters || []).forEach(item => {
                    if (item.type === 'numeric') {
                        if (item.min) total += 1;
                        if (item.max) total += 1;
                    } else if (Array.isArray(item.values)) {
                        total += item.values.length;
                    }
                });
                return total;
            };
            const metricCost = metricPricing();
            const filterCost = filterPricing();
            const basePrice = 5;
            const price = basePrice + metricCost + filterCost;
            const remaining = Math.max(0, walletBalance - price);
            wrapper.innerHTML = `
                <div class="selection-form">
                    <div class="step-title">Step 7 of 7: Price</div>
                    <div class="price-wallet-card">
                        <div class="price-wallet-row">
                            <div class="price-wallet-left">
                                <span class="price-wallet-icon">€</span>
                                <span>Your wallet balance</span>
                            </div>
                            <div style="font-weight:700;">€${walletBalance.toFixed(2)}</div>
                        </div>
                        <div class="price-wallet-row" style="font-size:14px;">
                            <div><strong>€${walletBalance.toFixed(2)}</strong> - €${price.toFixed(2)} = <strong style="color:#166534;">€${remaining.toFixed(2)}</strong></div>
                        </div>
                        <div class="price-remaining"><span class="dot">✓</span> Remaining balance</div>
                    </div>
                    <div style="margin-top:0.75rem;">Estimated price based on selected metrics and filters.</div>
                    <div id="priceValue" style="font-size: 22px; font-weight: 700; color: #3a3b45;">€${price.toFixed(2)}</div>
                    <div id="priceBreakdown" class="price-breakdown">
                        <div style="font-weight:700; margin-bottom:0.35rem;">Invoice breakdown</div>
                        <div class="price-breakdown-item"><div><span class="dot"></span>Base access</div><div>€${basePrice.toFixed(2)}</div></div>
                        <div class="price-breakdown-item"><div><span class="dot"></span>Metrics</div><div>€${metricCost.toFixed(2)}</div></div>
                        <div class="price-breakdown-item"><div><span class="dot"></span>Filtering dimensions</div><div>€${filterCost.toFixed(2)}</div></div>
                    </div>
                    <div class="selection-actions" style="margin-top:0.75rem;">
                        <button class="map-action-button is-active" type="button" id="checkoutBtn">Proceed to checkout</button>
                        <button class="map-action-button" type="button" id="cancelFlowBtn">Cancel</button>
                    </div>
                    <div class="modal-backdrop" id="checkoutModal" style="display:none;">
                        <div class="modal-card" style="max-width:420px; background:#ffffff; border-radius:12px; padding:1rem; border:1px solid #e5e7eb;">
                            <div style="font-weight:700; margin-bottom:0.5rem;">Confirm checkout</div>
                            <div style="font-size:13px; color:#4b5563; margin-bottom:0.75rem;">€${price.toFixed(2)} will be deducted from the wallet balance.</div>
                            <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
                                <button class="map-action-button" type="button" id="cancelCheckoutBtn">Cancel</button>
                                <button class="map-action-button is-active" type="button" id="confirmCheckoutBtn">Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(wrapper);

            const checkoutModal = wrapper.querySelector('#checkoutModal');

            wrapper.querySelector('#checkoutBtn')?.addEventListener('click', () => {
                if (checkoutModal) checkoutModal.style.display = 'flex';
            });

            wrapper.querySelector('#cancelCheckoutBtn')?.addEventListener('click', () => {
                if (checkoutModal) checkoutModal.style.display = 'none';
            });

            wrapper.querySelector('#confirmCheckoutBtn')?.addEventListener('click', () => {
                if (checkoutModal) checkoutModal.style.display = 'none';
                const checkoutBtn = wrapper.querySelector('#checkoutBtn');
                const cancelFlowBtn = wrapper.querySelector('#cancelFlowBtn');
                if (checkoutBtn) checkoutBtn.style.display = 'none';
                if (cancelFlowBtn) cancelFlowBtn.style.display = 'none';
                appendUserBubble('Payment confirmed.');
                const preparing = appendAIMessage('Preparing your data request…');
                setTimeout(() => {
                    if (preparing) preparing.remove();
                    appendVisualizationStep();
                }, 1800);
            });

            wrapper.querySelector('#cancelFlowBtn')?.addEventListener('click', () => {
                resetFlow();
                wrapper.remove();
            });
        }

        function appendVisualizationStep() {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';
            wrapper.innerHTML = `
                <div class="selection-form">
                    <div class="step-title">Visualization</div>
                    <div class="selection-group">
                        <label>Choose how to view the data</label>
                        <div class="selection-checks">
                            <label><input type="radio" name="vizType" value="Report"> Report</label>
                            <label><input type="radio" name="vizType" value="Pivot table"> Pivot table</label>
                            <label style="opacity:0.5; cursor:not-allowed;"><input type="radio" name="vizType" value="Premium" disabled> Premium visualizations</label>
                        </div>
                        <div style="font-size:12px; color:#6b7280; margin-top:0.35rem;">Premium unlocks custom dashboards and on-demand visuals.</div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(wrapper);

            wrapper.querySelectorAll('input[name="vizType"]').forEach(input => {
                input.checked = input.value === flowSelections.visualization;
                input.addEventListener('change', () => {
                    if (!input.checked) return;
                    flowSelections.visualization = input.value;
                    renderVisualizationSummary(wrapper, input.value);
                    appendVisualizationResult(input.value);
                });
            });
        }

        function renderVisualizationSummary(wrapper, selection) {
            const summary = escapeHtml(selection || 'Not specified');
            renderStepSummary(wrapper, 8, 'Visualization', summary, handleEditStep);
        }

        function appendVisualizationResult(selection) {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'message ai';
            wrapper.setAttribute('data-step', '8');
            wrapper.innerHTML = `
                <div class="selection-form">
                    <div class="step-title">${escapeHtml(selection)}</div>
                    <div class="selection-group">
                        ${selection === 'Pivot table'
                            ? '<div class="pivot-dimensions" id="pivotDimensions"></div><div id="pivotTableContainer" class="pivot-preview"></div>'
                            : '<div style="font-size:13px; color:#4b5563;">Report preview based on your selection will appear here.</div>'}
                    </div>
                </div>
            `;
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            if (selection === 'Pivot table') {
                initPivotTable(wrapper.querySelector('#pivotTableContainer'));
            }
        }

        function getPivotSampleData() {
            const data = [];
            const years = Array.from({ length: 11 }, (_, index) => 2010 + index);
            const bedroomOptions = [3, 4];
            years.forEach(year => {
                bedroomOptions.forEach(bedrooms => {
                    const yearOffset = year - 2010;
                    const price = 260000 + yearOffset * 9000 + (bedrooms - 3) * 26000;
                    data.push({
                        'Year built': year,
                        Bedrooms: `${bedrooms}`,
                        'Property type': 'Residential',
                        'Property sub-type': 'Apartment',
                        'Avg asking prices (€)': price
                    });
                });
            });
            return data;
        }

        function initPivotTable(container) {
            if (!container || !window.jQuery || !window.$ || !$.pivotUtilities) return;
            const data = getPivotSampleData();
            const years = new Set();
            const bedrooms = new Set();
            data.forEach(row => {
                years.add(row['Year built']);
                bedrooms.add(row.Bedrooms);
            });
            const dimensionsSummary = `Dimensions: Year built (${years.size}), Bedrooms (${bedrooms.size})`;
            const dimensionsEl = container.closest('#pivotPreview')?.querySelector('#pivotDimensions');
            if (dimensionsEl) dimensionsEl.textContent = dimensionsSummary;

            $(container).pivotUI(data, {
                rows: ['Year built'],
                cols: ['Bedrooms'],
                vals: ['Avg asking prices (€)'],
                aggregatorName: 'Average',
                rendererName: 'Table',
                hiddenAttributes: ['Property type', 'Property sub-type'],
                hiddenFromDragDrop: ['Property type', 'Property sub-type', 'Avg asking prices (€)'],
                onRefresh: () => {
                    const labels = container.querySelectorAll('.pvtFilterBox label');
                    labels.forEach(label => {
                        if (!label.dataset.cleaned) {
                            label.dataset.cleaned = 'true';
                            label.textContent = label.textContent.replace(/\s*\(\d+\)\s*$/, '');
                        }
                    });
                }
            }, true);
        }

        function handleEditStep(step) {
            removeStepMessagesAfter(step - 1);
            if (step === 2) {
                appendAIMessage('Select the transaction types you want to cover.', 2);
                appendStepTransactionTypes(flowSelections.area);
                return;
            }
            if (step === 3) {
                appendAIMessage(`Please filter the insights request for ${escapeHtml(flowSelections.area)}.`, 3);
                appendStepCharacteristics(flowSelections.area);
                return;
            }
            if (step === 4) {
                appendAIMessage('Great, now pick the data metrics you want to include.', 4);
                appendStepDataTypes();
                return;
            }
            if (step === 5) {
                appendAIMessage('Choose the time series scope for the data.', 5);
                appendStepTimeSeries();
                return;
            }
            if (step === 6) {
                appendAIMessage('Now choose the Data Quality Level range for the request.', 6);
                appendStepDql();
                return;
            }
            if (step === 8) {
                removeStepMessagesAfter(7);
                appendVisualizationStep();
                return;
            }
        }
        function resetFlow(preserveHistory = false, preserveSelections = false) {
            flowState = 'idle';
            flowSelections.area = '';
            if (!preserveSelections) {
                flowSelections.transactionTypes = [];
                flowSelections.propertyType = '';
                flowSelections.propertySubType = '';
                flowSelections.bedroomsMin = '';
                flowSelections.bedroomsMax = '';
                flowSelections.bathroomsMin = '';
                flowSelections.bathroomsMax = '';
                flowSelections.lotMin = '';
                flowSelections.lotMax = '';
                flowSelections.yearBuiltMin = '';
                flowSelections.yearBuiltMax = '';
                flowSelections.additionalFilters = [];
                flowSelections.dataTypes = [];
                flowSelections.dataMetrics = {};
                flowSelections.dataMetricsActive = '';
                flowSelections.timeSeries = '';
                flowSelections.dqlMin = '';
                flowSelections.dqlMax = '';
                flowSelections.visualization = '';
            }
            chatStarted = false;
            const welcomeSection = document.getElementById('welcomeSection');
            const chatMessages = document.getElementById('chatMessages');
            const chatContainer = document.getElementById('chatContainer');
            const chatBody = document.getElementById('chatBody');
            const mapPane = document.getElementById('mapPane');
            const mapCard = mapPane?.querySelector('.map-card');
            const pageContent = document.querySelector('.page-content');
            const header = document.querySelector('.chat-header');
            if (welcomeSection) welcomeSection.style.display = 'flex';
            if (chatMessages) {
                chatMessages.style.display = 'none';
                if (!preserveHistory) {
                    chatMessages.innerHTML = '';
                    areaSummaryWrapper = null;
                }
            }
            if (mapCard && welcomeSection) {
                welcomeSection.appendChild(mapCard);
            }
            if (chatContainer) {
                chatContainer.classList.add('initial');
                chatContainer.classList.remove('split');
            }
            if (chatBody) chatBody.style.display = 'none';
            if (pageContent) pageContent.classList.remove('chat-mode');
            if (header) header.classList.add('is-hidden');
            mapCollapsible = false;
            setMapCollapsed(false);
            const mapCollapseBtn = document.getElementById('mapCollapseBtn');
            if (mapCollapseBtn) mapCollapseBtn.classList.add('is-hidden');
            const messageInput = document.getElementById('messageInput');
            if (messageInput) messageInput.value = '';
            if (trustMap) {
                setTimeout(() => {
                    trustMap.invalidateSize();
                    if (districtsLayer) {
                        trustMap.fitBounds(districtsLayer.getBounds(), { padding: [20, 20] });
                    }
                }, 50);
            }
        }

        function handleUserMessage(message) {
            const lower = message.toLowerCase();
            if (lower.includes('cancel')) {
                resetFlow();
                return;
            }

            if (message.startsWith('I want to gather real estate insights from')) {
                flowSelections.area = message.replace('I want to gather real estate insights from', '').replace('.', '').trim();
                flowState = 'collecting';
                appendAIMessage('Select the transaction types you want to cover.', 2);
                appendSelectionForm(flowSelections.area);
                return;
            }

            if (flowState === 'idle') {
                appendAIMessage(generateResponse(message));
                return;
            }

            appendAIMessage('If you want to restart, type “cancel”.');
        }

        function generateResponse(question) {
            const lowerQuestion = question.toLowerCase();

            if (lowerQuestion.includes('energy certificate') || lowerQuestion.includes('certificado energético')) {
                return `Yes, the energy certificate (Certificado Energético) is absolutely mandatory for all property sales in Portugal. Here are the key requirements:<br><br><strong>Legal Requirements:</strong><br>• Must be obtained before advertising the property for sale<br>• Certificate must be less than 10 years old<br>• Must be issued by a certified energy expert<br>• Energy rating must be displayed in all property advertisements<br><br><strong>Consequences of non-compliance:</strong><br>• Fines ranging from €250 to €44,890<br>• Potential contract nullification<br>• Buyer can withdraw from purchase agreement<br>• Legal liability for damages`;
            }

            if (lowerQuestion.includes('documents') && lowerQuestion.includes('sell')) {
                return `For a complete property sale in Portugal, you must provide these essential documents:<br><br><strong>Mandatory Documents:</strong><br>1. <strong>Caderneta Predial</strong> - Property tax registration<br>2. <strong>Certidão Permanente do Registo Predial</strong> - Property registry certificate<br>3. <strong>Certificado Energético</strong> - Energy performance certificate<br>4. <strong>Licença de Utilização</strong> - Use permit/habitability license<br>5. <strong>Technical Housing Booklet</strong> - For properties built after 2008<br><br><strong>Additional Requirements:</strong><br>• Condominium documents (if applicable)<br>• Urban planning information<br>• Disclosure of any known defects or legal issues<br>• Proof of payment of property taxes (IMI)<br>• Proof of condominium fees are current`;
            }

            if (lowerQuestion.includes('disclosure')) {
                return `In Portugal, sellers have specific disclosure obligations:<br><br><strong>Mandatory Disclosures:</strong><br>• Any known structural defects or problems<br>• Previous water damage or flooding<br>• Pest infestations or treatments<br>• Legal disputes affecting the property<br>• Outstanding liens or mortgages<br>• Boundary disputes with neighbors<br><br><strong>Legal Consequences:</strong><br>• Failure to disclose can result in contract nullification<br>• Buyer may seek damages for undisclosed defects<br>• Criminal liability for fraudulent concealment<br><br>Always err on the side of full disclosure to protect yourself legally.`;
            }

            if (lowerQuestion.includes('tax')) {
                return `Property taxes in Portugal for real estate transactions include:<br><br><strong>For Sellers:</strong><br>• <strong>IMT (Municipal Property Transfer Tax)</strong> - Paid by buyer but seller must ensure compliance<br>• <strong>Stamp Duty</strong> - 0.8% of property value<br>• <strong>Capital Gains Tax</strong> - On profit from sale (varies by circumstances)<br><br><strong>For Buyers:</strong><br>• <strong>IMT rates vary by property value:</strong><br>- Up to €92,407: 0%<br>- €92,408 to €126,403: 2%<br>- €126,404 to €172,348: 5%<br>- €172,349 to €287,213: 7%<br>- Above €287,213: 8%<br><br><strong>Annual Property Tax (IMI):</strong><br>• 0.3% to 0.45% of property's tax value<br>• Paid annually by property owner`;
            }

            return `Thank you for your question about Portuguese real estate law. I'm analyzing your inquiry and providing guidance based on current legal requirements. For specific legal advice tailored to your unique situation, I recommend consulting with a qualified Portuguese attorney who can review your particular circumstances and provide personalized guidance.<br><br>Is there any specific aspect of this topic you'd like me to elaborate on?`;
        }

        function handleEnterKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage(event);
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            const maxHeight = parseInt(getComputedStyle(textarea).maxHeight) || 100;
            textarea.style.height = Math.min(textarea.scrollHeight, maxHeight) + 'px';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function prefillFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const area = params.get('area');
            if (!area) return;
            flowSelections.area = area;
            selectedAreaLabel = area;
            const transactionTypes = params.get('transactionTypes');
            if (transactionTypes) flowSelections.transactionTypes = transactionTypes.split('|').filter(Boolean);
            const propertyType = params.get('propertyType');
            if (propertyType) flowSelections.propertyType = propertyType;
            const propertySubType = params.get('propertySubType');
            if (propertySubType) flowSelections.propertySubType = propertySubType;
            const bedroomsMin = params.get('bedroomsMin');
            const bedroomsMax = params.get('bedroomsMax');
            if (bedroomsMin) flowSelections.bedroomsMin = bedroomsMin;
            if (bedroomsMax) flowSelections.bedroomsMax = bedroomsMax;
            const dataTypes = params.get('dataTypes');
            if (dataTypes) flowSelections.dataTypes = dataTypes.split('|').filter(Boolean);
            const timeSeries = params.get('timeSeries');
            if (timeSeries) flowSelections.timeSeries = timeSeries;
            const dqlMin = params.get('dqlMin');
            const dqlMax = params.get('dqlMax');
            if (dqlMin) flowSelections.dqlMin = dqlMin;
            if (dqlMax) flowSelections.dqlMax = dqlMax;
            const visualization = params.get('visualization');
            if (visualization) flowSelections.visualization = visualization;

            startChat();
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return;
            const areaSummaryWrapper = document.createElement('div');
            renderStepSummary(areaSummaryWrapper, 1, 'Area', `Area: ${escapeHtml(area)}`, handleEditStep);
            chatMessages.appendChild(areaSummaryWrapper);
            appendStepTransactionTypes(area);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Auto-resize textarea on input
        document.getElementById('messageInput').addEventListener('input', function() {
            autoResizeTextarea(this);
        });

        // Focus input on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('messageInput').focus();
            initTrustLayerMap();
            prefillFromQuery();
        });
    </script>
    <script src="../../common-mock-assets/components/modals/language-modal.js"></script>
    <script src="../../common-mock-assets/js/profile-dropdown.js"></script>
    <script src="../../common-mock-assets/js/notifications-dropdown.js"></script>
    <script src="../../common-mock-assets/js/help-dropdown.js"></script>
</body>
