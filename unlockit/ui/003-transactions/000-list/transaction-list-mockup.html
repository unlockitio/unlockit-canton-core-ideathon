    <script>
        let isExpanded = false;

        function showCreateTransactionSection() {
            // Show create transaction section (it will overlay the entire content)
            document.getElementById('createTransactionSection').classList.add('show');

            // Scroll to top to show the section
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Reset section state
            isExpanded = false;
            document.getElementById('mainTransactionRow').classList.remove('fade');
            document.getElementById('additionalOptions').classList.remove('show');
        }

        function hideCreateTransactionSection() {
            // Hide create transaction section (return to normal view)
            document.getElementById('createTransactionSection').classList.remove('show');
        }

        let currentWorkflowType = '';
        let currentStep = 1;
        const totalSteps = 3;
        let workflowData = {};

        function createTransaction(type) {
            console.log('Creating transaction of type:', type);
            currentWorkflowType = type;
            currentStep = 1;
            workflowData = {};

            // Hide transaction type selection
            document.getElementById('createTransactionSection').classList.remove('show');

            // Show workflow creation form immediately
            showWorkflowCreationForm(type);
        }

        function showWorkflowCreationProcess(type) {
            const steps = getWorkflowSteps(type);
            let currentStep = 0;

            function showNextStep() {
                if (currentStep >= steps.length) {
                    alert(`${type.charAt(0).toUpperCase() + type.slice(1)} workflow created successfully!\n\nYou would now be redirected to the workflow management page.`);
                    return;
                }

                const step = steps[currentStep];
                const isLast = currentStep === steps.length - 1;

                setTimeout(() => {
                    const message = `Step ${currentStep + 1} of ${steps.length}: ${step}\n\n${isLast ? 'Creating workflow...' : 'Click OK to continue to next step.'}`;
                    alert(message);

                    currentStep++;
                    if (!isLast) {
                        showNextStep();
                    } else {
                        // Final step - create the workflow
                        setTimeout(() => {
                            alert(`${type.charAt(0).toUpperCase() + type.slice(1)} workflow created successfully!\n\nWorkflow ID: WF-${Date.now()}\nStatus: Draft - Ready for configuration`);
                        }, 1000);
                    }
                }, 500);
            }

            // Start the process
            alert(`Initializing ${type.charAt(0).toUpperCase() + type.slice(1)} workflow creation...\n\nVerifying quota and permissions...`);
            setTimeout(showNextStep, 1000);
        }

        function getWorkflowSteps(type) {
            const workflowSteps = {
                'sell': [
                    'General Information - Enter property details and transaction value',
                    'Property Details - Specify location, type, and characteristics',
                    'Participants - Add buyers, lawyers, and other stakeholders',
                    'Documents Setup - Configure required documentation checklist'
                ],
                'rental_landlord': [
                    'General Information - Enter rental terms and monthly value',
                    'Property Details - Specify location, type, and rental features',
                    'Participants - Add tenants and manage applications',
                    'Rental Terms - Configure lease duration and conditions'
                ],
                'rental_tenant': [
                    'General Information - Enter rental search criteria',
                    'Property Details - Specify desired location and features',
                    'Landlord Info - Add landlord and property owner details',
                    'Rental Terms - Review and accept lease conditions'
                ],
                'buy': [
                    'General Information - Enter purchase details and budget',
                    'Property Search - Specify desired location and characteristics',
                    'Financing - Configure mortgage and payment terms',
                    'Participants - Add sellers, brokers, and financial institutions'
                ],
                'contract': [
                    'Contract Type - Specify service agreement or partnership type',
                    'Terms & Conditions - Define deliverables and timeline',
                    'Parties - Add contracting organizations and signatories',
                    'Legal Review - Configure approval and compliance workflow'
                ],
                'recruitment': [
                    'Job Description - Define role requirements and responsibilities',
                    'Candidate Pipeline - Configure screening and interview stages',
                    'Stakeholders - Add hiring managers, HR, and interview panel',
                    'Onboarding Process - Setup documentation and approval workflow'
                ]
            };

            return workflowSteps[type.toLowerCase()] || [
                'Basic Information - Enter workflow details',
                'Configuration - Setup workflow parameters',
                'Participants - Add relevant stakeholders',
                'Finalization - Review and create workflow'
            ];
        }

        function showWorkflowCreationForm(type) {
            console.log('Showing workflow creation form for:', type);

            // Show the form section first
            const workflowSection = document.getElementById('workflowCreationSection');
            workflowSection.classList.add('show');

            // Scroll to top to show the workflow form
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Update form title and subtitle based on transaction type and step
            updateStepContent(type, 1);

            // Update stepper visibility based on type
            updateStepperVisibility(type);

            console.log('Workflow form should be visible now');
        }

        function hideWorkflowCreationSection() {
            document.getElementById('workflowCreationSection').classList.remove('show');

            // Reset form and step
            document.getElementById('workflowCreationForm').reset();
            document.getElementById('commissionValueGroup').style.display = 'none';
            currentStep = 1;
            workflowData = {};

            // Show transaction type selection again
            showCreateTransactionSection();
        }

        function updateStepperVisibility(type) {
            const stepper = document.getElementById('stepperContainer');

            // Show stepper for sell, buy, rental_landlord, rental_tenant, and contract transactions (which have the 3-step process)
            if (type.toLowerCase() === 'sell' || type.toLowerCase() === 'buy' || type.toLowerCase() === 'rental_landlord' || type.toLowerCase() === 'rental_tenant' || type.toLowerCase() === 'contract') {
                stepper.style.display = 'flex';
                updateStepperState();
            } else {
                stepper.style.display = 'none';
            }
        }

        function updateStepperState() {
            for (let i = 1; i <= totalSteps; i++) {
                const step = document.getElementById(`step${i}`);
                step.classList.remove('active', 'completed');

                if (i < currentStep) {
                    step.classList.add('completed');
                } else if (i === currentStep) {
                    step.classList.add('active');
                }
            }
        }

        function updateStepContent(type, step) {
            const titleElement = document.getElementById('workflowTypeTitle');
            const formContent = document.querySelector('.workflow-form-content');

            console.log('Updating step content for:', type, 'step:', step);

            if (type.toLowerCase() === 'sell') {
                switch (step) {
                    case 1:
                        titleElement.textContent = 'New Transaction: Sell';
                        formContent.innerHTML = getGeneralInfoForm('sell');
                        break;
                    case 2:
                        titleElement.textContent = 'Edit Transaction: Sell';
                        formContent.innerHTML = getPropertyForm('sell');
                        break;
                    case 3:
                        titleElement.textContent = 'Edit Transaction: Sell';
                        formContent.innerHTML = getParticipantsForm();
                        break;
                }
            } else if (type.toLowerCase() === 'buy') {
                switch (step) {
                    case 1:
                        titleElement.textContent = 'New Transaction: Buy';
                        formContent.innerHTML = getGeneralInfoForm('buy');
                        break;
                    case 2:
                        titleElement.textContent = 'Edit Transaction: Buy';
                        formContent.innerHTML = getPropertyForm('buy');
                        break;
                    case 3:
                        titleElement.textContent = 'Edit Transaction: Buy';
                        formContent.innerHTML = getParticipantsForm();
                        break;
                }
            } else if (type.toLowerCase() === 'rental_landlord') {
                switch (step) {
                    case 1:
                        titleElement.textContent = 'New Transaction: Rental Landlord';
                        formContent.innerHTML = getGeneralInfoForm('rental_landlord');
                        break;
                    case 2:
                        titleElement.textContent = 'Edit Transaction: Rental Landlord';
                        formContent.innerHTML = getPropertyForm('rental_landlord');
                        break;
                    case 3:
                        titleElement.textContent = 'Edit Transaction: Rental Landlord';
                        formContent.innerHTML = getParticipantsForm();
                        break;
                }
            } else if (type.toLowerCase() === 'rental_tenant') {
                switch (step) {
                    case 1:
                        titleElement.textContent = 'New Transaction: Rental Tenant';
                        formContent.innerHTML = getGeneralInfoForm('rental_tenant');
                        break;
                    case 2:
                        titleElement.textContent = 'Edit Transaction: Rental Tenant';
                        formContent.innerHTML = getPropertyForm('rental_tenant');
                        break;
                    case 3:
                        titleElement.textContent = 'Edit Transaction: Rental Tenant';
                        formContent.innerHTML = getParticipantsForm();
                        break;
                }
            } else if (type.toLowerCase() === 'contract') {
                switch (step) {
                    case 1:
                        titleElement.textContent = 'New Contract: Upload File';
                        formContent.innerHTML = getContractUploadForm();
                        break;
                    case 2:
                        titleElement.textContent = 'Edit Contract: Add Signers';
                        formContent.innerHTML = getContractSignersForm();
                        break;
                    case 3:
                        titleElement.textContent = 'Contract: Review & Finalize';
                        formContent.innerHTML = getContractReviewForm();
                        break;
                }
            } else {
                // For other types, show single form
                const titles = {
                    'recruitment': 'Create Recruitment Workflow'
                };
                titleElement.textContent = titles[type.toLowerCase()] || `Create ${type.charAt(0).toUpperCase() + type.slice(1)} Workflow`;
                formContent.innerHTML = getGeneralInfoForm('other');
            }

            // Update button text
            updateButtonStates();
        }

        function updateButtonStates() {
            const backBtn = document.getElementById('backBtn');
            const continueBtn = document.getElementById('continueBtn');

            if (currentWorkflowType.toLowerCase() === 'sell' || currentWorkflowType.toLowerCase() === 'buy' || currentWorkflowType.toLowerCase() === 'rental_landlord' || currentWorkflowType.toLowerCase() === 'rental_tenant' || currentWorkflowType.toLowerCase() === 'contract') {
                // Multi-step process for sell, buy, rental landlord, rental tenant, and contract
                if (currentStep === 1) {
                    backBtn.textContent = 'Go back';
                    backBtn.onclick = hideWorkflowCreationSection;
                } else {
                    backBtn.textContent = 'Go back';
                    backBtn.onclick = goToPreviousStep;
                }

                if (currentStep === totalSteps) {
                    if (currentWorkflowType.toLowerCase() === 'contract') {
                        continueBtn.textContent = 'Create Contract';
                    } else {
                        continueBtn.textContent = 'Finish';
                    }
                } else {
                    continueBtn.textContent = 'Next';
                }
            } else {
                // Single step for other types
                backBtn.textContent = 'Go back';
                backBtn.onclick = hideWorkflowCreationSection;
                continueBtn.textContent = 'Create Workflow';
            }
        }

        function continueToNextStep() {
            if ((currentWorkflowType.toLowerCase() === 'sell' || currentWorkflowType.toLowerCase() === 'buy' || currentWorkflowType.toLowerCase() === 'rental_landlord' || currentWorkflowType.toLowerCase() === 'rental_tenant' || currentWorkflowType.toLowerCase() === 'contract') && currentStep < totalSteps) {
                // Save current step data
                saveCurrentStepData();

                // Move to next step
                currentStep++;
                updateStepContent(currentWorkflowType, currentStep);
                updateStepperState();

                // Scroll to top to show the new step
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                // Final submission
                submitWorkflowForm();
            }
        }

        function goToPreviousStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStepContent(currentWorkflowType, currentStep);
                updateStepperState();

                // Scroll to top to show the previous step
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function saveCurrentStepData() {
            const form = document.getElementById('workflowCreationForm');
            const formData = new FormData(form);

            formData.forEach((value, key) => {
                workflowData[key] = value;
            });
        }

        function getGeneralInfoForm(type = 'sell') {
            const isRental = type === 'rental_landlord' || type === 'rental_tenant';
            const isRentalTenant = type === 'rental_tenant';
            const isRentalLandlord = type === 'rental_landlord';
            const isBuy = type === 'buy';
            const isSell = type === 'sell';

            const priceLabel = isRentalTenant ? 'Monthly rent' : isRentalLandlord ? 'Monthly rent' : isBuy ? 'Purchase value' : 'Selling price';
            const commissionTypes = isRental ?
                `<option value="">Select commission type...</option>
                 <option value="RENT" selected>Rent</option>
                 <option value="PERCENTAGE">Percentage</option>
                 <option value="FIXED">Fixed Amount</option>
                 <option value="NONE">No Commission</option>` :
                `<option value="">Select commission type...</option>
                 <option value="PERCENTAGE" selected>Percentage</option>
                 <option value="FIXED">Fixed Amount</option>
                 <option value="NONE">No Commission</option>`;

            const frequencyRow = isRental ?
                `<div class="form-row">
                    <div class="form-group full-width">
                        <label class="form-label required">Frequency Type</label>
                        <select class="form-select" name="frequencyType" required>
                            <option value="">Select frequency...</option>
                            <option value="MONTHLY" selected>Monthly</option>
                            <option value="YEARLY">Yearly</option>
                        </select>
                    </div>
                </div>` : '';

            const commissionLabel = isRental ? 'Commission value (Number of Rents)' : 'Commission value';

            const priceFields = (isBuy || isRentalTenant) ? `
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required">Minimum ${priceLabel}</label>
                        <div class="currency-input-group">
                            <select class="currency-symbol" style="border: none; background: #f8f9fa; border-right: 1px solid #e7e7e7;">
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                            </select>
                            <input type="number" class="currency-input" name="transactionValueMin" placeholder="${isRentalTenant ? '800' : '300000'}" value="${isRentalTenant ? '800' : '300000'}" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">Maximum ${priceLabel}</label>
                        <div class="currency-input-group">
                            <select class="currency-symbol" style="border: none; background: #f8f9fa; border-right: 1px solid #e7e7e7;">
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                            </select>
                            <input type="number" class="currency-input" name="transactionValueMax" placeholder="${isRentalTenant ? '1500' : '500000'}" value="${isRentalTenant ? '1500' : '500000'}" required>
                        </div>
                    </div>
                </div>` : `
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-input" name="externalId" placeholder="123456" value="123456">
                    </div>
                    <div class="form-group">
                        <label class="form-label required">${priceLabel}</label>
                        <div class="currency-input-group">
                            <select class="currency-symbol" style="border: none; background: #f8f9fa; border-right: 1px solid #e7e7e7;">
                                <option value="EUR">EUR</option>
                                <option value="USD">USD</option>
                            </select>
                            <input type="number" class="currency-input" name="transactionValue" placeholder="400000" value="400000" required>
                        </div>
                    </div>
                </div>`;

            return `
                <form id="workflowCreationForm">
                    <div class="form-section">
                        <h3 class="form-section-title">Details</h3>

                        ${(isBuy || isRentalTenant) ? '<div class="form-row"><div class="form-group full-width"><label class="form-label">ID</label><input type="text" class="form-input" name="externalId" placeholder="123456" value="123456"></div></div>' : ''}
                        ${priceFields}

                        ${frequencyRow}

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label required">Commission type</label>
                                <select class="form-select" name="commissionType" id="commissionType" required>
                                    ${commissionTypes}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label required">${commissionLabel}</label>
                                <input type="number" class="form-input" name="commissionValue" placeholder="5" value="5" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <div style="color: #747474; font-size: 14px; margin-bottom: 1rem;">
                                    Total commission: 20.000,00€
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label class="form-label required">Expiration date</label>
                                <div style="display: flex; gap: 0.5rem; align-items: flex-end; margin-bottom: 1rem;">
                                    <input type="date" class="form-input" name="expirationDate" value="2025-12-20" style="flex: 1;">
                                    <button type="button" class="quick-btn" onclick="setQuickDate(6)">6 months</button>
                                    <button type="button" class="quick-btn" onclick="setQuickDate(9)">9 months</button>
                                    <button type="button" class="quick-btn selected" onclick="setQuickDate(12)">12 months</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label class="form-label">Name for the process</label>
                                <input type="text" class="form-input" name="title" placeholder="KW Mafra" value="KW Mafra">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group full-width">
                                <label class="form-label">Description of the process</label>
                                <textarea class="form-textarea" name="description" placeholder="Enter description..." rows="3"></textarea>
                                <div style="text-align: right; font-size: 12px; color: #747474; margin-top: 4px;">
                                    <span id="descriptionCounter">0</span>/4000
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            `;
        }

        function getPropertyForm(type = '') {
            const isBuy = type === 'buy' || currentWorkflowType === 'buy';

            const typologyFields = isBuy ? `
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label required">Minimum Typology</label>
                        <select class="form-select" name="typologyMin" required>
                            <option value="">Select minimum...</option>
                            <option value="T0">T0</option>
                            <option value="T1" selected>T1</option>
                            <option value="T2">T2</option>
                            <option value="T3">T3</option>
                            <option value="T4">T4</option>
                            <option value="T5">T5</option>
                            <option value="T6">T6</option>
                            <option value="T7">T7</option>
                            <option value="T8PLUS">T8+</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">Maximum Typology</label>
                        <select class="form-select" name="typologyMax" required>
                            <option value="">Select maximum...</option>
                            <option value="T0">T0</option>
                            <option value="T1">T1</option>
                            <option value="T2">T2</option>
                            <option value="T3" selected>T3</option>
                            <option value="T4">T4</option>
                            <option value="T5">T5</option>
                            <option value="T6">T6</option>
                            <option value="T7">T7</option>
                            <option value="T8PLUS">T8+</option>
                        </select>
                    </div>
                </div>` : `
                <div class="form-row">
                    <div class="form-group full-width">
                        <label class="form-label required">Typology</label>
                        <select class="form-select" name="typology" required>
                            <option value="">Select typology...</option>
                            <option value="T0">T0</option>
                            <option value="T1">T1</option>
                            <option value="T2" selected>T2</option>
                            <option value="T3">T3</option>
                            <option value="T4">T4</option>
                            <option value="T5">T5</option>

        const getFilteredTransactions = () => {
            const searchValue = (searchInput.value || '').trim().toLowerCase();
            const typeValue = typeFilter.value;
            const statusValue = statusFilter.value;
            const sortValue = sortOrder.value;

            let filtered = transactionData.filter(transaction => {
                if (typeValue && transaction.type !== typeValue) return false;
                if (statusValue && transaction.status !== statusValue) return false;
                if (searchValue) {
                    const haystack = [
                        transaction.id,
                        transaction.typeLabel,
                        transaction.verification,
                        transaction.title,
                        transaction.location,
                        transaction.value,
                        transaction.statusLabel
                    ].join(' ').toLowerCase();
                    if (!haystack.includes(searchValue)) return false;
                }
                return true;
            });

            if (sortValue === 'amount') {
                filtered.sort((a, b) => b.amountValue - a.amountValue);
            } else if (sortValue === 'asc') {
                filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            } else {
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            }

            return filtered;
        };

            const filtered = getFilteredTransactions();

            if (showMoreButton) {
                const shouldHide = filtered.length <= INITIAL_VISIBLE;
                showMoreButton.parentElement.style.display = shouldHide ? 'none' : 'flex';
                showMoreButton.textContent = showAllTransactions ? 'Show Less' : 'Show More';
            }
        };

        // Postal Code Management Functions
        let postalCodes = [];

        function addPostalCode() {
            const input = document.getElementById('postalCodeInput');
            const postalCode = input.value.trim();

            if (!postalCode) {
                alert('Please enter a postal code');
                return;
            }

            const postalCodeRegex = /^\d{4}-\d{3}$/;
            if (!postalCodeRegex.test(postalCode)) {
                alert('Please enter a valid postal code format (e.g., 2640-456)');
                return;
            }

            if (postalCodes.includes(postalCode)) {
                alert('This postal code has already been added');
                return;
            }

            postalCodes.push(postalCode);
            input.value = '';
            updatePostalCodeList();
        }

        function removePostalCode(code) {
            postalCodes = postalCodes.filter(pc => pc !== code);
            updatePostalCodeList();
        }

        function updatePostalCodeList() {
            const listContainer = document.getElementById('postalCodeList');
            const dataInput = document.getElementById('postalCodesData');

            if (!listContainer) return;

            if (postalCodes.length === 0) {
                listContainer.innerHTML = '<div style="color: #747474; font-size: 14px; padding: 0.5rem 0;">No postal codes added yet</div>';
            } else {
                listContainer.innerHTML = postalCodes.map(code => `
                    <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: #f0f3ff; border: 1px solid var(--color-primary); border-radius: 6px; color: var(--color-primary); font-size: 14px; font-weight: 500;">
                        <span>${code}</span>
                        <button type="button" onclick="removePostalCode('${code}')" style="background: none; border: none; color: var(--color-primary); cursor: pointer; font-size: 16px; padding: 0; line-height: 1; font-weight: bold;">×</button>
                    </div>
                `).join('');
            }

            if (dataInput) {
                dataInput.value = JSON.stringify(postalCodes);
            }
        }

        // Override the updateStepContent to add event listeners after form is created
        const originalUpdateStepContent = updateStepContent;
        updateStepContent = function(type, step) {
            originalUpdateStepContent(type, step);

            // Add event listeners after content is updated
            setTimeout(() => {
                setupFormEventListeners();

                if (type === 'buy' && step === 2) {
                    postalCodes = [];

                    if (postalInput) {

                            if (e.key === 'Enter') {

                                addPostalCode();
                            }
                        });
                    }
                }
            }, 100);
        };

    <script>
        // Contracts and Documents Merge/Divide Preference Handler
        function getUserPreferences() {
            try {
                const saved = localStorage.getItem('unlockit_preferences');
                return saved ? JSON.parse(saved) : { mergeContractsDocuments: false };
            } catch (error) {
                console.error('Error loading preferences:', error);
                return { mergeContractsDocuments: false };
            }
        }

        // Store original content to allow proper restoration
        let originalDocumentsContent = null;
        let originalContractsContent = null;
        let contentStoredOnLoad = false;

        function storeOriginalContent() {
            // Only store once on initial page load before any transformations
            if (contentStoredOnLoad) return;

            const detailsPanel = document.querySelector('.transaction-details-panel');
            if (!detailsPanel) return;

            const allSections = detailsPanel.querySelectorAll('.details-section');
            allSections.forEach(section => {
                const titleElement = section.querySelector('.details-section-title');
                if (titleElement) {
                    const titleText = titleElement.textContent.toLowerCase();
                    if (titleText.includes('documents') && !titleText.includes('&')) {
                        const contentElement = section.querySelector('.details-section-content');
                        if (contentElement) {
                            originalDocumentsContent = {
                                title: titleElement.textContent,
                                content: contentElement.innerHTML
                            };
                        }
                    } else if (titleText.includes('contracts')) {
                        const contentElement = section.querySelector('.details-section-content');
                        if (contentElement) {
                            originalContractsContent = {
                                title: titleElement.textContent,
                                content: contentElement.innerHTML
                            };
                        }
                    }
                }
            });

            contentStoredOnLoad = true;
        }

        function applyContractsDocumentsPreference() {
            // Find the documents and contracts sections
            const detailsPanel = document.querySelector('.transaction-details-panel');
            if (!detailsPanel) return;

            // Store original content on first run (before any transformations)
            storeOriginalContent();

            // Get preference
            const preferences = getUserPreferences();
            const shouldMerge = preferences.mergeContractsDocuments;

            // Find existing sections
            const allSections = detailsPanel.querySelectorAll('.details-section');
            let documentsSection = null;
            let contractsSection = null;

            allSections.forEach(section => {
                const titleElement = section.querySelector('.details-section-title');
                if (titleElement) {
                    const titleText = titleElement.textContent.toLowerCase();
                    if (titleText.includes('documents')) {
                        documentsSection = section;
                    } else if (titleText.includes('contracts')) {
                        contractsSection = section;
                    }
                }
            });

            if (!documentsSection || !contractsSection) return;
            if (!originalDocumentsContent || !originalContractsContent) return;

            if (shouldMerge) {
                // Merge contracts into documents section
                const documentsTitle = documentsSection.querySelector('.details-section-title');
                const documentsList = documentsSection.querySelector('.details-section-content');
                const contractsList = contractsSection.querySelector('.details-section-content');

                if (documentsTitle && originalDocumentsContent && originalContractsContent) {
                    // Parse counts from original titles
                    const docCountMatch = originalDocumentsContent.title.match(/\((\d+)\)/);
                    const contractCountMatch = originalContractsContent.title.match(/\((\d+)\)/);
                    const docCount = docCountMatch ? parseInt(docCountMatch[1]) : 0;
                    const contractCount = contractCountMatch ? parseInt(contractCountMatch[1]) : 0;
                    const totalCount = docCount + contractCount;
                    documentsTitle.textContent = `Documents & Contracts (${totalCount})`;
                }

                // Merge content: combine documents and contracts
                if (documentsList && originalDocumentsContent && originalContractsContent) {
                    // Create combined content
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = originalDocumentsContent.content + originalContractsContent.content;
                    documentsList.innerHTML = tempDiv.innerHTML;
                }

                // Hide contracts section
                contractsSection.style.display = 'none';

                // Add data attribute to track merged state
                documentsSection.setAttribute('data-merged', 'true');
            } else {
                // Divide: restore original sections
                const documentsTitle = documentsSection.querySelector('.details-section-title');
                const documentsList = documentsSection.querySelector('.details-section-content');

                // Restore original content
                if (documentsTitle && documentsList && originalDocumentsContent) {
                    documentsTitle.textContent = originalDocumentsContent.title;
                    documentsList.innerHTML = originalDocumentsContent.content;
                }

                // Show contracts section again
                contractsSection.style.display = 'block';

                // Remove merged state
                documentsSection.removeAttribute('data-merged');
            }
        }

        // Apply preference on page load
        document.addEventListener('DOMContentLoaded', function() {
            applyContractsDocumentsPreference();
        });

        // Listen for preference updates (same page)
        document.addEventListener('preferencesUpdated', function(event) {
            applyContractsDocumentsPreference();
        });

        // Listen for localStorage changes from other tabs/windows
        window.addEventListener('storage', function(e) {
            if (e.key === 'unlockit_preferences') {
                // Reset content stored flag to allow re-storing
                contentStoredOnLoad = false;
                originalDocumentsContent = null;
                originalContractsContent = null;
                applyContractsDocumentsPreference();
            }
        });

        // Recheck preferences when window gains focus (in case changed from preferences page)
        window.addEventListener('focus', function() {
            applyContractsDocumentsPreference();
        });
    </script>

</body>
</html>
