include required("shared.conf")

canton {
    sequencers.sequencer {
        storage = ${_shared.storage}
        storage.config.properties.databaseName = "canton_domain"

        public-api {
            address = 0.0.0.0
            port = 10038
        }

        admin-api {
            address = 0.0.0.0
            port = 10039
        }

        sequencer {
            type = BFT
            block {
            writer = ${?_shared.sequencer-writer}
            reader = ${?_shared.sequencer-reader}
            writer.type = high-throughput
            }
        }

        monitoring {
            grpc-health-server {
                address = 0.0.0.0
                port = 10033
            }
            http-health-server {
                address = 0.0.0.0
                port = 10034
            }
        }
    }

    mediators.mediator {

    storage = ${_shared.storage}
    storage.config.properties.databaseName = "canton_mediator"

    admin-api {
        address = 0.0.0.0
        port = 10042
    }

    monitoring {
        grpc-health-server {
            address = 0.0.0.0
            port = 10043
        }
        http-health-server {
            address = 0.0.0.0
            port = 10044
        }
    }
}
