# Canton Configuration for RETVN

canton {
  features {
    enable-preview-commands = yes
    enable-testing-commands = yes
  }

  parameters {
    non-standard-config = yes
    dev-version-support = yes
  }

  participants {
    participant1 {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties = {
            serverName = ${?CANTON_DB_HOST}
            serverName = "postgres"
            portNumber = ${?CANTON_DB_PORT}
            portNumber = "5432"
            databaseName = ${?CANTON_DB_NAME}
            databaseName = "canton"
            user = ${?CANTON_DB_USER}
            user = "canton"
            password = ${?CANTON_DB_PASSWORD}
            password = "canton_password"
          }
        }
      }

      admin-api {
        address = "0.0.0.0"
        port = 5011
      }

      ledger-api {
        address = "0.0.0.0"
        port = 5021
        tls = null
      }

      parameters {
        initial-protocol-version = 4
      }
    }
  }

  domains {
    domain1 {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties = {
            serverName = ${?CANTON_DB_HOST}
            serverName = "postgres"
            portNumber = ${?CANTON_DB_PORT}
            portNumber = "5432"
            databaseName = ${?CANTON_DB_NAME}
            databaseName = "canton"
            user = ${?CANTON_DB_USER}
            user = "canton"
            password = ${?CANTON_DB_PASSWORD}
            password = "canton_password"
          }
        }
      }

      public-api {
        address = "0.0.0.0"
        port = 5018
      }

      admin-api {
        address = "0.0.0.0"
        port = 5019
      }

      parameters {
        initial-protocol-version = 4
      }
    }
  }
}
