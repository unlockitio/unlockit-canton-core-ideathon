# HTTP Configuration
quarkus.http.port=9090
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=*

# Canton JSON API (via NGINX CORS proxy in Docker)
canton.api.url=${CANTON_JSON_API_URL:http://localhost:8080}
canton.api.timeout=30s
canton.api.package-id=b919ab0836ef285aa313fa34566638088a101dd305bf3173b62add0499c0e860
canton.api.operator-party-id=operator-d4d95138::1220ca3ede9902f8c5ec2b780f1df454b5adab9b73840424e2e2af7c21cae93db753

# REST Client configuration for Canton API
quarkus.rest-client.canton-api.url=${CANTON_JSON_API_URL:http://localhost:8080}
quarkus.rest-client.canton-api.scope=jakarta.inject.Singleton

# Canton gRPC Ledger API (Sandbox)
canton.grpc.host=${CANTON_GRPC_HOST:localhost}
canton.grpc.port=${CANTON_GRPC_PORT:6865}
canton.grpc.app-id=CantonAutomationApp

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.unlockit".level=DEBUG
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1000
