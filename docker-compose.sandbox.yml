services:
  # Daml Sandbox (in-memory ledger for development)
  canton-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
      args:
        DAML_SDK_VERSION_SHORT: 3.4.0-rc2
        DAML_SDK_VERSION_FULL: 3.4.0-snapshot.20251022.14344.0.v4acf13f9
    image: daml-sdk-sandbox:3.4.0-rc2
    container_name: retvn-canton-sandbox
    environment:
      - DAML_VERSION=3.4.0-rc2
    volumes:
      - .:/workspace
    command: >
      bash -c "
        cd /workspace
        echo 'Testing DAML command...' &&
        daml version &&
        echo 'Building DAML packages...' &&
        daml build --no-cache &&
        echo 'Starting Local Ledger and Json Ledger API...' &&
        daml sandbox --port 6865 --json-api-port 7575 --dar .daml/dist/unlockit-canton-core-ideathon-0.0.1.dar -C canton.participants.sandbox.ledger-api.address=0.0.0.0 -C canton.participants.sandbox.http-ledger-api.server.address=0.0.0.0 --log-level-root=WARN --log-profile=container 2>&1 | tee /tmp/sandbox.log &
        echo 'Waiting for Canton sandbox ready message...' &&
        while [ ! -f /tmp/sandbox.log ]; do sleep 1; done &&
        tail -f /tmp/sandbox.log | grep -q 'Canton sandbox is ready' &&
        echo 'Canton sandbox is ready, seeding test credentials...' &&
        daml script --dar /workspace/.daml/dist/unlockit-canton-core-ideathon-0.0.1.dar --script-name SeedCredentials:seedTestCredentials --ledger-host localhost --ledger-port 6865 &&
        echo 'Test credentials seeded successfully!' &&
        tail -f /tmp/sandbox.log
      "
    ports:
      - "6865:6865"   # Sandbox Ledger API
      - "7575:7575"   # JSON API
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 bash -c '</dev/tcp/localhost/6865' && timeout 5 bash -c '</dev/tcp/localhost/7575' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - retvn-sandbox-network

  # Nginx CORS proxy
  nginx-cors:
    image: nginx:alpine
    container_name: retvn-nginx-cors
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - canton-sandbox
    networks:
      - retvn-sandbox-network

  # React frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_CANTON_API_URL: http://localhost:8080/
    container_name: retvn-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_CANTON_API_URL=http://localhost:8080/
      - VITE_CANTON_WS_URL=ws://localhost:8080/
    depends_on:
      - nginx-cors
    networks:
      - retvn-sandbox-network

  # Swagger UI for Canton JSON Ledger API
  swagger-ui-canton:
    image: swaggerapi/swagger-ui:latest
    container_name: retvn-swagger-ui-canton
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/openapi/openapi.yaml
      - BASE_URL=/
    volumes:
      - ./openapi.yaml:/openapi/openapi.yaml:ro
    networks:
      - retvn-sandbox-network

  # Swagger UI for Backend API documentation
  swagger-ui-backend:
    image: swaggerapi/swagger-ui:latest
    container_name: retvn-swagger-ui-backend
    ports:
      - "8082:8080"
    environment:
      - SWAGGER_JSON=/openapi/openapi.yaml
      - BASE_URL=/
    volumes:
      - ./be/openapi.yaml:/openapi/openapi.yaml:ro
    networks:
      - retvn-sandbox-network

networks:
  retvn-sandbox-network:
    driver: bridge

