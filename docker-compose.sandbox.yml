services:
  # Daml Sandbox (in-memory ledger for development)
  canton-sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
      args:
        DAML_SDK_VERSION_SHORT: 3.4.0-rc2
        DAML_SDK_VERSION_FULL: 3.4.0-snapshot.20251022.14344.0.v4acf13f9
    image: daml-sdk-sandbox:3.4.0-rc2
    container_name: retvn-canton-sandbox
    environment:
      - DAML_VERSION=3.4.0-rc2
    volumes:
      - .:/workspace
    command: >
      bash -c "
        cd /workspace &&
        echo 'Testing DAML command...' &&
        daml version &&
        echo 'Building DAML packages...' &&
        daml build --no-cache &&
        echo 'Starting Local Ledger and Json Ledger API...' &&
        daml sandbox --port 6865 --json-api-port 7575 --dar .daml/dist/unlockit-canton-core-ideathon-0.0.1.dar -C canton.participants.sandbox.ledger-api.address=0.0.0.0 -C canton.participants.sandbox.http-ledger-api.server.address=0.0.0.0 --log-level-root=INFO --log-profile=container
      "
    ports:
      - "6865:6865"   # Sandbox Ledger API
      - "7575:7575"   # JSON API
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 bash -c '</dev/tcp/localhost/6865' && timeout 5 bash -c '</dev/tcp/localhost/7575' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - retvn-sandbox-network

  # Nginx CORS proxy
  nginx-cors:
    image: nginx:alpine
    container_name: retvn-nginx-cors
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - canton-sandbox
    networks:
      - retvn-sandbox-network

  # React frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_CANTON_API_URL: http://localhost:8080/
    container_name: retvn-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_CANTON_API_URL=http://localhost:8080/
      - VITE_CANTON_WS_URL=ws://localhost:8080/
    depends_on:
      - nginx-cors
    networks:
      - retvn-sandbox-network

networks:
  retvn-sandbox-network:
    driver: bridge

