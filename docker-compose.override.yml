# Docker Compose override for development
# This file is automatically used by docker-compose in addition to docker-compose.yml

services:
  # Development overrides for Canton
  canton:
    volumes:
      # Mount local Daml source for easier development
      - ./daml:/canton/daml:ro
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "5005:5005"  # Java debugger

  # Development overrides for frontend
  frontend:
    # In development, you might want to run frontend locally with hot reload
    # Comment out this service and run: cd fe && npm run dev
    build:
      args:
        NODE_ENV: development

  # Development database - enable logging
  postgres:
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
